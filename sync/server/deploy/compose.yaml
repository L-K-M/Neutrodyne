services:
  neutrodyne-server:
    image: ${NEUTRODYNE_SERVER_IMAGE:-ghcr.io/l-k-m/neutrodyne-server:latest}
    restart: unless-stopped
    environment:
      NEUTRODYNE_SERVER_PUBLIC_URL: https://${SYNC_HOST:-sync.example.org}
      # Must cover the proxies' addresses; it follows SYNC_SUBNET so the two
      # cannot drift apart. The default sits inside 172.16.0.0/12 and can
      # collide with routes the host already has (an AWS default VPC is
      # 172.31.0.0/16): choose another SYNC_SUBNET on such a host.
      NEUTRODYNE_SERVER_TRUSTED_PROXIES: ${SYNC_SUBNET:-172.31.87.0/24}
      NEUTRODYNE_SERVER_UPDATE_CHECK: ${UPDATE_CHECK:-true}
    volumes:
      - neutrodyne-data:/data
    networks: [sync]
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 320m
  caddy:
    # caddy:2; the tag is mutable, so the image is pinned by digest.
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    environment:
      SYNC_HOST: ${SYNC_HOST:-sync.example.org}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [sync]
networks:
  sync:
    ipam:
      config: [{subnet: "${SYNC_SUBNET:-172.31.87.0/24}"}]
volumes:
  neutrodyne-data: {}
  caddy-data: {}
  caddy-config: {}
