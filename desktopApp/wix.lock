#
# The WiX Toolset build jpackage's MSI step uses on the Windows runner (11 Lockfiles,
# PO-48's MS-RL named case). Compose 1.12.1 downloads and unzips WiX itself (its
# downloadWix/unzipWix tasks, pinned to wix3112rtm — recorded 2026-10-06 as a deviation
# from "WiX 3.14 or 5.x found by jpackage" in 11 and 01, because the plugin brings its
# own pinned WiX 3.11.2), so this lock pins exactly that: the binaries zip it downloads
# and the wix3 source archive at the same tag, which the release attaches as
# wix-{version}-src.tar.gz (sources job, 09 release.yml step 4).
#
# binaryTable lists the MSI Binary-table entries a Neutrodyne MSI may carry (11 Image
# scan rules), confirmed 2026-10-09 against the first built MSI (nightly 37935771413):
# JpCaDll is jpackage's own custom action (its compiled wixhelper), WixCA is WiX Util's
# custom action behind RemoveFolderEx, and WixUIWixca plus the WixUI_Bmp_/WixUI_Ico_
# resources are the licence dialog of WixUIExtension. Patterns match by fnmatch.
version=3.11.2
tag=wix3112rtm

installer.url=https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip
installer.sha256=2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e

source.name=wix-3.11.2-src.tar.gz
