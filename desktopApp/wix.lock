#
# The WiX Toolset build jpackage's MSI step uses on the Windows runner (11 Lockfiles,
# PO-48's MS-RL named case). Compose 1.12.1 downloads and unzips WiX itself (its
# downloadWix/unzipWix tasks, pinned to wix3112rtm — recorded 2026-10-06 as a deviation
# from "WiX 3.14 or 5.x found by jpackage" in 11 and 01, because the plugin brings its
# own pinned WiX 3.11.2), so this lock pins exactly that: the binaries zip it downloads
# and the wix3 source archive at the same tag, which the release attaches as
# wix-{version}-src.tar.gz (sources job, 09 release.yml step 4).
#
# binaryTable lists the MSI Binary-table entries a Neutrodyne MSI may carry (11 Image
# scan rules): jpackage's wixhelper.dll, WiX Util's custom action behind RemoveFolderEx
# and the WixUI resources of the licence dialog. The exact IDs below were confirmed
# by Windows package run 42457761741 (2026-11-08), not inferred from DLL filenames.
# JpCaDll is OpenJDK jpackage's wixhelper.dll resource:
# https://github.com/openjdk/jdk25u/blob/master/src/jdk.jpackage/windows/classes/jdk/jpackage/internal/resources/main.wxs
# The remaining IDs come from the pinned WiX sources:
# https://github.com/wixtoolset/wix3/blob/wix3112rtm/src/ext/UIExtension/wixlib/Common.wxs
# https://github.com/wixtoolset/wix3/blob/wix3112rtm/src/ext/UIExtension/wixlib/Common_Platform.wxi
# https://github.com/wixtoolset/wix3/blob/wix3112rtm/src/ext/UtilExtension/wixlib/UtilExtension.wxs
