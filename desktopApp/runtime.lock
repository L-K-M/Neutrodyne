# SPDX-License-Identifier: Unlicense
#
# The OpenJDK runtime every desktop image bundles (11 Lockfiles, D3's runtime exception,
# D89): one vendor and version per release, unmodified, jlink-trimmed. Renovate detects
# new Temurin releases (regex manager); the PR that bumps one version updates every
# checksum together, taking each SHA-256 from Adoptium's release-name API:
#   https://api.adoptium.net/v3/assets/release_name/eclipse/jdk-<version>
# (jdk-image packages of the four targets plus the sources package).
#
# Keys read by build-logic (DesktopPackaging.kt) and scripts/ci/check-runtime-sources.sh:
#   vendor, vendorVersion, version, javaVersion, javaRuntimeVersion,
#   sourceTarball.{name,url,sha256},
#   <target>.{archiveUrl,sha256} for windows-x64, macos-arm64, linux-x64, linux-arm64.
# javaVersion is JAVA_VERSION of the JDK's release file (what a jlink'd runtime/release
# carries); javaRuntimeVersion is the java.runtime.version system property (the version
# with HotSpot's -LTS suffix); version keeps the Adoptium build suffix. Temurin 25
# archives ship no jmods/ but are built with --enable-linkable-runtime (JEP 493), so
# jlink links from them (verified 2026-10-06, recorded in 11 jlink modules).
