# SPDX-License-Identifier: Unlicense
#
# nightly.yml — 09's overnight jobs. M0a carries `instrumented-full` (debug
# leg), `api37-16k`, `release-build-smoke` and the report-only `repro`; the
# other jobs land with their milestones (`system-tests` M6b, `no-engine-build`
# M9a, `desktop-matrix` M0b, `sync-convergence` MS0, `server-image-smoke` MS1,
# `benchmark-dryrun` M10, `screenshots-full` M10, `mutation-full` M1a,
# `live-canary`, `youtube-canary` and `engine-nightly-canary` M9a).
#
# A failing job runs scripts/ci/report-nightly.sh, which opens or updates one
# issue per job (label `nightly-failure`) and closes it after the next green
# run; `repro` reports under the `repro` label and never blocks a release.
#
# Every job checks out github.sha — the exact commit the run's head_sha records
# — and never a dispatch input ref: release.sh accepts a dispatched youtube-smoke
# run as the hotfix gate by head_sha, so a checkout of anything else would let
# green jobs prove the wrong commit (fixed 2026-10-06; the `ref` input with its
# `main` default is gone — dispatch on a branch through the native ref selector).

name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "full | youtube-smoke (release smoke + api36 debug YouTube smoke; the hotfix path) | desktop (M0b)"
        default: full

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  LANG: C.UTF-8

jobs:
  instrumented-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'youtube-smoke'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      # Debug leg: every device module's suite on api26/api33/api34/api36 GMDs
      # (09). youtube-smoke narrows it to the YouTube smoke tests on api36.
      # Step timeout: a hung test still leaves time to report and upload (see ci.yml).
      - name: GMD nightly group (debug)
        timeout-minutes: 60
        run: |
          if [ "${{ inputs.scope }}" = "youtube-smoke" ]; then
            ./gradlew --max-workers=2 api36DebugAndroidTest \
              -Pneutrodyne.testScope=nightly \
              -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true \
              -Pandroid.testInstrumentationRunnerArguments.class=ch.lkmc.neutrodyne.YouTubeReleaseSmokeTest,ch.lkmc.neutrodyne.SmokeTest
          else
            ./gradlew --max-workers=2 nightlyGroupDebugAndroidTest \
              -Pneutrodyne.testScope=nightly \
              -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          fi
      # TODO (M6b): release leg — :benchmark's out-of-process release smoke
      # journeys and E10's companions against :app release on api36 (09).
      - name: Report failure
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh instrumented-full
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh instrumented-full --close
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !success() }}
        with:
          name: instrumented-full-results
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/

  api37-16k:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # Build every APK the two emulator steps install before the first emulator boots: compiling
      # beside a 4-core emulator starved it, and system_server lost its providers mid-run
      # (nightly 2026-10-08: "Cannot access system provider: 'settings'" at install time).
      - name: Build the test APKs before the emulators boot
        run: |
          ./gradlew --max-workers=2 -Pneutrodyne.testScope=nightly -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true assembleDebug assembleDebugAndroidTest
          ./gradlew --max-workers=2 -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.annotation=ch.lkmc.neutrodyne.core.testing.ReleaseSmoke -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Debug suite on the API 37 16 KB image
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          target: google_apis_ps16k
          arch: x86_64
          # The 16 KB-page image boots slowly on the hosted runners: with the action's 2 cores, default
          # RAM and 600 s timeout it never finished booting (nightly 2026-10-07).
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          # Guest-side rendering and three-button navigation: with host rendering this image's
          # gralloc mapper aborts surfaceflinger whenever SystemUI samples the gesture handle's
          # region ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"), and each
          # abort restarts system_server (nightly 2026-10-08: 4-12 aborts in 3 min under
          # swiftshader_indirect, swangle_indirect, emulator 37.3.3 and the 37.1 image; none
          # with -gpu guest after the switch to three-button navigation).
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          # android-emulator-runner runs each script line as its own `sh -c`, so a command
          # must fit on one line (a `\` continuation becomes a literal argument).
          # sys.boot_completed can precede the settings and package services; the wait line
          # holds the run until both answer (5 min cap).
          script: |
            adb logcat -v threadtime > "$RUNNER_TEMP/logcat-api37-debug.txt" 2>&1 &
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384" || { echo "PAGE_SIZE != 16384"; exit 1; }
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            timeout 120 adb shell 'until cmd overlay enable com.android.internal.systemui.navbar.threebutton; do sleep 2; done'
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            ./gradlew --max-workers=2 -Pneutrodyne.testScope=nightly -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true connectedDebugAndroidTest
      - name: Release smoke on API 37
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          target: google_apis_ps16k
          arch: x86_64
          # The 16 KB-page image boots slowly on the hosted runners: with the action's 2 cores, default
          # RAM and 600 s timeout it never finished booting (nightly 2026-10-07).
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          # Guest-side rendering and three-button navigation: with host rendering this image's
          # gralloc mapper aborts surfaceflinger whenever SystemUI samples the gesture handle's
          # region ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"), and each
          # abort restarts system_server (nightly 2026-10-08: 4-12 aborts in 3 min under
          # swiftshader_indirect, swangle_indirect, emulator 37.3.3 and the 37.1 image; none
          # with -gpu guest after the switch to three-button navigation).
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -v threadtime > "$RUNNER_TEMP/logcat-api37-release.txt" 2>&1 &
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            timeout 120 adb shell 'until cmd overlay enable com.android.internal.systemui.navbar.threebutton; do sleep 2; done'
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            ./gradlew --max-workers=2 -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.annotation=ch.lkmc.neutrodyne.core.testing.ReleaseSmoke -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true :app:connectedReleaseAndroidTest
            # TODO (M6b): :benchmark's out-of-process release smoke journeys join here.
      # The device log of both emulator steps, for diagnosing a failed run (system_server state).
      - name: Upload the emulator logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api37-16k-logcat
          path: ${{ runner.temp }}/logcat-api37-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the release APKs for the alignment check
        run: ./gradlew assembleRelease -Pneutrodyne.abiSplits=true
      - name: 16 KB alignment on the release x86_64 APK (PLAN M11 AC7)
        run: scripts/ci/check-apk.sh --alignment-only app/build/outputs/apk/release/app-x86_64-release.apk
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh api37-16k
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh api37-16k --close

  release-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'youtube-smoke'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      # E0 (and from M9a E7) on the published release build — a GMD api36 run of
      # the release variant's tests (PLAN M0 AC4).
      - name: api36 release smoke
        run: ./gradlew -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.annotation=ch.lkmc.neutrodyne.core.testing.ReleaseSmoke -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true api36ReleaseAndroidTest
      - name: The tested release build is not debuggable
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-x86_64-release.apk
          [ -n "$BT" ] || { echo "::error::no aapt2 under $ANDROID_HOME/build-tools"; exit 1; }
          [ -f "$APK" ] || { echo "::error::missing release APK: $APK"; exit 1; }
          # a failed dump aborts the step (bash -e); only its output can clear the flag
          BADGING="$($BT dump badging "$APK")"
          if grep -q application-debuggable <<<"$BADGING"; then
            echo "::error::release APK is debuggable"
            exit 1
          fi
          echo "release APK is not debuggable"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh release-build-smoke
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh release-build-smoke --close

  desktop-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runs-on: windows-2025
          - target: macos-arm64
            runs-on: macos-15
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'desktop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Android SDK (the KMP android targets configure AGP in every module)
        shell: bash
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          # One SDK location for AGP: the runner image's inherited
          # ANDROID_SDK_ROOT must not disagree with ANDROID_HOME, and on
          # Windows Gradle needs the C:\ form, not the MSYS one.
          sdk_dir="$HOME/android-sdk"
          command -v cygpath >/dev/null 2>&1 && sdk_dir="$(cygpath -w "$sdk_dir")"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # jlink's strip needs objcopy; jpackage's DEB step needs fakeroot/dpkg-deb and
      # the RPM step rpmbuild; xvfb+dbus for the packaged smoke starts.
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          pkgs="binutils fakeroot rpm xvfb dbus-x11"
          # skiko-linux-arm64 links libEGL.so.1, which the arm image lacks (its
          # other NEEDED entries already resolve); libegl1 pulls the Mesa EGL
          # vendor for the software path (nightly 37831500506).
          [ "${{ matrix.target }}" = linux-arm64 ] && pkgs="$pkgs libegl1"
          sudo apt-get install -y -qq $pkgs
      # linux-arm64 cannot run the Android host tests: the SDK's aapt2/aidl and
      # Gradle's aapt2 are x86_64 binaries and Robolectric ships no linux/aarch64
      # runtime (nightly 37831500506). Excluding that task family also prunes its
      # Android prerequisites (process*UnitTestResources, compile*Aidl); the
      # desktop JVM and JVM-island suites still run, and ci.yml's unit job keeps
      # the Android host coverage on linux-x64.
      - name: Unit tests on this host
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = linux-arm64 ]; then
            ./gradlew allTests test \
              -x testAndroidHostTest -x testDebugUnitTest \
              -Proborazzi.test.verify=true --continue
          else
            ./gradlew allTests test -Proborazzi.test.verify=true --continue
          fi
      # One image per install kind: the kind rides the Gradle property into the
      # image's build-info, and the matching package task consumes that image.
      - name: Package the target's formats
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            windows-x64)
              ./gradlew createDistributable packageMsi -Pneutrodyne.installKind=msi
              ./gradlew createDistributable packageZip -Pneutrodyne.installKind=zip ;;
            macos-arm64)
              ./gradlew createDistributable -Pneutrodyne.installKind=mac-zip ;;
            linux-*)
              ./gradlew createDistributable packageDeb -Pneutrodyne.installKind=deb
              ./gradlew createDistributable packageRpm -Pneutrodyne.installKind=rpm
              ./gradlew createDistributable packageTarGz -Pneutrodyne.installKind=tar.gz ;;
          esac
      - name: macOS 0.x ZIP (PO-39; the DMG joins at 1.0.0)
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p dist
          v="$(grep '^neutrodyne.versionName=' gradle.properties | cut -d= -f2)"
          app="desktopApp/build/compose/binaries/main/app/Neutrodyne.app"
          scripts/desktop/mac-zip.sh --app "$app" --version "$v" --out "dist/neutrodyne-$v-macos-arm64.zip"
      - name: Collect the outputs
        shell: bash
        run: |
          mkdir -p dist
          cp -r desktopApp/build/compose/binaries/main/app/Neutrodyne* dist/ 2>/dev/null || true
          find desktopApp/build/compose/binaries/main \( -name '*.msi' -o -name '*.dmg' \) -print0 | xargs -0 -r -I{} cp {} dist/
          find desktopApp/build/desktop-packaging -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) -print0 | xargs -0 -r -I{} cp {} dist/
          ls -la dist/
      # Every package gets the packaged smoke start (11 Testing); the SMOKE lines
      # feed check-runtime-sources.sh below.
      - name: Smoke start every package
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/smoke-img
          touch smoke.txt
          # Every package's own smoke must pass: the xvfb/dbus runs are nested
          # bash shells whose pipefail is their own — without it tee masks a
          # launcher failure — and the count below requires one SMOKE line per
          # run, not just any.
          smokes=0
          smoke() { smokes=$((smokes + 1)); scripts/desktop/smoke-start.sh "$1" | tee -a smoke.txt; }
          xsmoke() { smokes=$((smokes + 1)); xvfb-run -a dbus-run-session bash -eo pipefail -c 'scripts/desktop/smoke-start.sh "$1" | tee -a smoke.txt' _ "$1"; }
          case "${{ matrix.target }}" in
            linux-*)
              sudo dpkg -i dist/*.deb
              # The installed tree is root-owned: the smoke appends its
              # java-option to the image .cfg, so the DEB leg smokes the
              # extracted payload (the same installKind=deb bits) instead of
              # chmod'ing /opt (nightly 37831500506).
              dpkg-deb -x dist/*.deb /tmp/smoke-img/deb-payload
              xsmoke /tmp/smoke-img/deb-payload/opt/neutrodyne
              rpm2cpio dist/*.rpm | (cd /tmp/smoke-img && cpio -idm --quiet)
              xsmoke /tmp/smoke-img/opt/neutrodyne
              tar -xzf dist/*.tar.gz -C /tmp/smoke-img
              xsmoke /tmp/smoke-img/Neutrodyne ;;
            windows-x64)
              powershell -NoProfile -Command "Start-Process msiexec -Wait -ArgumentList '/i','$(cygpath -w "$(pwd)/dist/"*.msi)','/qn','/norestart'"
              smoke "$LOCALAPPDATA/Programs/Neutrodyne"
              python -m zipfile -e dist/*.zip /tmp/smoke-img
              smoke /tmp/smoke-img/Neutrodyne ;;
            macos-arm64)
              ditto -x -k dist/*.zip /tmp/smoke-img
              smoke /tmp/smoke-img/Neutrodyne.app ;;
          esac
          got="$(grep -c '^SMOKE {' smoke.txt || true)"
          [ "$got" -eq "$smokes" ] || { echo "::error::$smokes package smokes ran but smoke.txt holds $got SMOKE lines"; exit 1; }
          echo "$got/$smokes package smokes produced a SMOKE line"
      - name: Image and runtime checks
        shell: bash
        run: |
          set -e
          img="$(ls -d dist/Neutrodyne dist/Neutrodyne.app 2>/dev/null | head -1)"
          inputs=("$img")
          while IFS= read -r f; do inputs+=("$f"); done \
            < <(find dist -maxdepth 1 -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \))
          scripts/ci/check-desktop-image.sh "${inputs[@]}"
          scripts/ci/check-runtime-sources.sh --image "$img" --smoke smoke.txt
          if [ "${{ matrix.target }}" = "macos-arm64" ]; then
            codesign --verify --deep --strict "$img"
          fi
      - name: Sizes into the summary (PB27 trend)
        shell: bash
        run: |
          img="$(ls -d dist/Neutrodyne dist/Neutrodyne.app 2>/dev/null | head -1)"
          {
            echo "| file | MiB |"
            echo "| --- | --- |"
            for f in "$img" dist/*; do
              [ -e "$f" ] || continue
              echo "| $(basename "$f") | $(( $(du -sk "$f" | cut -f1) / 1024 )) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh desktop-matrix-${{ matrix.target }}
      - name: Report recovery
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh desktop-matrix-${{ matrix.target }} --close
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: desktop-matrix-${{ matrix.target }}
          path: dist/

  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # Two builds, different checkout paths / CPU counts / umasks (09). Both
      # signed with the committed key, so the APKs compare byte for byte.
      - name: Build A
        run: scripts/ci/repro-build.sh --path /build/a --cpus 2 --umask 022 assembleRelease -Pneutrodyne.abiSplits=true
      - name: Copy build A outputs aside
        run: mkdir -p /tmp/repro-a && cp app/build/outputs/apk/release/*-release.apk /tmp/repro-a/
      - name: Build B
        run: |
          git clean -fdx app/build >/dev/null
          scripts/ci/repro-build.sh --path /home/builder/src/neutrodyne --cpus 4 --umask 002 assembleRelease -Pneutrodyne.abiSplits=true
      # TODO (M0b): also diff the desktop application JARs and the server JAR;
      # the container then installs Temurin 25 from runtime.lock.
      - name: Compare the APKs
        id: diff
        run: |
          ok=1
          for a in /tmp/repro-a/*-release.apk; do
            b="app/build/outputs/apk/release/$(basename "$a")"
            sa=$(sha256sum "$a" | cut -d' ' -f1)
            sb=$(sha256sum "$b" | cut -d' ' -f1)
            echo "$(basename "$a"): $sa vs $sb"
            [ "$sa" = "$sb" ] || ok=0
          done
          echo "identical=$ok" >> "$GITHUB_OUTPUT"
      - name: diffoscope on a difference
        if: steps.diff.outputs.identical == '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq diffoscope >/dev/null
          for a in /tmp/repro-a/*-release.apk; do
            b="app/build/outputs/apk/release/$(basename "$a")"
            diffoscope --html "diff-$(basename "$a").html" "$a" "$b" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.diff.outputs.identical == '0'
        with:
          name: repro-diffoscope
          path: diff-*.html
      - name: Report a mismatch (label repro — report-only, never blocks)
        if: failure() || steps.diff.outputs.identical == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh repro --label repro
      - name: Report recovery
        if: success() && steps.diff.outputs.identical == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh repro --label repro --close
