# SPDX-License-Identifier: Unlicense
#
# nightly.yml — 09's overnight jobs. M0a carries `instrumented-full` (debug
# leg), `api37-16k`, `release-build-smoke` and the report-only `repro`; M1a
# adds `mutation-full`; MD0 adds `desktop-matrix` (the four desktop targets'
# unit tests, FFmpeg builds and licence checks); M6b adds `system-tests` and
# the out-of-process smoke legs. The other jobs land with their
# milestones (`no-engine-build` M9a, `sync-convergence` MS0,
# `server-image-smoke` MS1, `benchmark-dryrun` M10, `screenshots-full` M10,
# `live-canary`, `youtube-canary` and `engine-nightly-canary` M9a).
#
# A failing job runs scripts/ci/report-nightly.sh, which opens or updates one
# issue per job (label `nightly-failure`) and closes it after the next green
# run; `repro` reports under the `repro` label and never blocks a release.
#
# Every job checks out github.sha — the exact commit the run's head_sha records
# — and never a dispatch input ref: release.sh accepts a dispatched youtube-smoke
# run as the hotfix gate by head_sha, so a checkout of anything else would let
# green jobs prove the wrong commit (fixed 2026-10-06; the `ref` input with its
# `main` default is gone — dispatch on a branch through the native ref selector).

name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "full | reboot (the API 37 release leg with the host-driven boot resumption driver) | youtube-smoke (release smoke + api36 debug YouTube smoke; the hotfix path) | downloads (M6a journeys on API26/33/34/36) | desktop (M0b) | first-launch-restore (M3's seeded first-launch restore gate on api26 + api36) | bmgr (published-release local backup/restore on API31 + API36) | bgstart (M4 P6b external background-start impossibility gate on API31 + API36) | bmgr-api29-probe (synthetic stock-image diagnostic, not acceptance) | bmgr-legacy-negative (stock API28/29 refusal evidence, not app acceptance)"
        default: full

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  LANG: C.UTF-8
  RELEASE_ABI_TARGET_APK: app/build/outputs/apk/release/app-x86_64-release.apk
  RELEASE_ABI_TARGET_SHA: app/build/release-abi-target.sha256

jobs:
  instrumented-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'youtube-smoke' || inputs.scope == 'downloads'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          # Apply access to the existing node; udev alone left it inaccessible.
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      # Debug leg: every device module's suite on api26/api33/api34/api36 GMDs
      # (09). youtube-smoke narrows it to the YouTube smoke tests on api36.
      # Step timeout: a hung test still leaves time to report and upload (see ci.yml).
      - name: GMD nightly group (debug)
        timeout-minutes: 90
        run: |
          # One worker avoids queuing a device lease behind the 30-minute case.
          readonly -a GMD_LIMITS=(--max-workers=1 -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1)
          # A later emulator launch deletes unconsented Crashpad reports.
          readonly CRASH_STOP_FILE="$RUNNER_TEMP/gmd-crash-preserver.stop"
          python3 scripts/ci/preserve-emulator-crashes.py \
            "/tmp/android-$USER" build/outputs/androidTest-results/emulator-crashes "$CRASH_STOP_FILE" &
          readonly CRASH_PRESERVER_PID=$!
          trap 'status=$?; touch "$CRASH_STOP_FILE"; if ! wait "$CRASH_PRESERVER_PID" && [ "$status" -eq 0 ]; then status=1; fi; exit "$status"' EXIT
          if [ "${{ inputs.scope }}" = "youtube-smoke" ]; then
            ./gradlew --info "${GMD_LIMITS[@]}" api36DebugAndroidTest \
              -Pneutrodyne.testScope=nightly \
              -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true \
              -Pandroid.testInstrumentationRunnerArguments.class=ch.lkmc.neutrodyne.YouTubeReleaseSmokeTest,ch.lkmc.neutrodyne.SmokeTest
          elif [ "${{ inputs.scope }}" = "downloads" ]; then
            ./gradlew --info "${GMD_LIMITS[@]}" nightlyGroupDebugAndroidTest \
              -Pneutrodyne.testScope=nightly \
              -Pandroid.testInstrumentationRunnerArguments.class=ch.lkmc.neutrodyne.DownloadJourneyTest \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          else
            # Use Lavapipe/ANGLE after the captured legacy-renderer crash.
            ./gradlew --info "${GMD_LIMITS[@]}" nightlyGroupDebugAndroidTest nightlyGroupAndroidDeviceTest \
              -Pneutrodyne.testScope=nightly \
              -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true \
              -Pandroid.testoptions.manageddevices.emulator.gpu=lavapipe
          fi
      - name: Require M5 playback and M6a download evidence
        if: inputs.scope != 'youtube-smoke' && inputs.scope != 'downloads'
        run: python3 scripts/ci/assert-playback-tests.py nightly app/build/outputs/androidTest-results --device api26 --device api33 --device api34 --device api36 --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      # M7 evidence gate: the share/deep-link journeys and the shared replay cases
      # run on every nightly GMD (PLAN M7 AC4, AC7, AC8, AC10).
      - name: Require discovery cases on the nightly devices
        if: inputs.scope != 'youtube-smoke' && inputs.scope != 'downloads'
        run: python3 scripts/ci/assert-discovery-tests.py app/build/outputs/androidTest-results --device api26 --device api33 --device api34 --device api36
      - name: Out-of-process smoke on api36 (benchmarkRelease fallback)
        if: inputs.scope != 'youtube-smoke'
        timeout-minutes: 40
        run: scripts/ci/system-tests.sh smoke api36
      - name: Require explicitly selected M6a journeys
        if: inputs.scope == 'downloads'
        run: python3 scripts/ci/assert-playback-tests.py downloads app/build/outputs/androidTest-results --device api26 --device api33 --device api34 --device api36 --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Report failure
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh instrumented-full
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh instrumented-full --close
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: instrumented-full-results
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
            benchmark/build/reports/system-tests/
          if-no-files-found: error

  system-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == '' || inputs.scope == 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      - name: E10 on bench34 (benchmarkRelease fallback)
        timeout-minutes: 45
        run: scripts/ci/system-tests.sh process-death bench34
      - name: Report failure
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh system-tests
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh system-tests --close
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: system-tests-results
          path: |
            benchmark/build/outputs/androidTest-results/
            benchmark/build/reports/androidTests/
            benchmark/build/reports/system-tests/
          if-no-files-found: error

  api37-16k:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'reboot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # android-emulator-runner reuses $ANDROID_HOME/cmdline-tools/latest and the ubuntu-24.04
      # image ships revision 12.0: its avdmanager exits 0 but writes target=android-0 into the
      # AVD descriptor for a dotted api-level like 37.0 (ReactiveCircus/android-emulator-runner
      # PR 494, issuetracker 546200928), which mis-configures the image it boots. Install the
      # checksum-pinned tools (23.0) before the action creates any AVD; `sdkmanager
      # "cmdline-tools;latest"` cannot fix this — it lands in a sibling latest-2 the action
      # never puts on PATH.
      - name: Install the pinned SDK tools
        run: scripts/ci/install-android-sdk.sh
      # Build every APK the two emulator steps install before the first emulator boots: compiling
      # beside a 4-core emulator starved it, and system_server lost its providers mid-run
      # (nightly 2026-10-08: "Cannot access system provider: 'settings'" at install time).
      - name: Build the test APKs before the emulators boot
        run: |
          ./gradlew --max-workers=2 -Pneutrodyne.testScope=nightly -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true assembleDebug assembleDebugAndroidTest :core:database:assembleAndroidDeviceTest
          ./gradlew --max-workers=2 -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.annotation=ch.lkmc.neutrodyne.core.testing.ReleaseSmoke -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true :app:assembleRelease :app:assembleReleaseAndroidTest
          ./gradlew --max-workers=2 -Pneutrodyne.systemTests=true :benchmark:assembleBenchmarkRelease :app:assembleBenchmarkRelease
          # The safeguard only holds if every APK the emulator scripts install exists now -
          # a task left out above compiles, dexes and packages inside the booted 4-core
          # emulator and starves system_server the same way.
          for apk in app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/outputs/apk/androidTest/release/app-release-androidTest.apk core/database/build/outputs/apk/androidTest/database-androidTest.apk; do test -f "$apk" || { echo "::error::$apk missing - it would build inside the emulator"; exit 1; }; done
          test -n "$(find app/build/outputs/apk/debug -name 'app-*-debug.apk' -print -quit)" || { echo "::error::debug app APKs missing"; exit 1; }
          test -n "$(find app/build/outputs/apk/release -name 'app-*-release.apk' -print -quit)" || { echo "::error::release app APKs missing"; exit 1; }
      - name: Debug suite on the API 37 16 KB image
        if: inputs.scope != 'reboot'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: true # never boot a retained AVD — see the target check below
          # The action's automatic animation disable (its default) runs unguarded
          # `settings put` right after sys.boot_completed; on this slow-booting image the
          # settings service was not up and the third put died on "Broken pipe" before our
          # script could wait for it (nightly 2026-10-10, run 38057314395). The script below
          # applies the same scales after its bounded service wait.
          disable-animations: false
          # The 16 KB-page image boots slowly on the hosted runners: with the action's 2 cores, default
          # RAM and 600 s timeout it never finished booting (nightly 2026-10-07).
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          # Guest-side rendering and three-button navigation: with host rendering this image's
          # gralloc mapper aborts surfaceflinger whenever SystemUI samples the gesture handle's
          # region ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"), and each
          # abort restarts system_server (nightly 2026-10-08: 4-12 aborts in 3 min under
          # swiftshader_indirect, swangle_indirect, emulator 37.3.3 and the 37.1 image; none
          # with -gpu guest after the switch to three-button navigation).
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          # avdmanager's exit status cannot be trusted (12.0 exits 0 on a broken AVD), so check
          # the files it wrote: the descriptor gets target=android-0 and config.ini loses its
          # target= line entirely when the tools cannot parse the dotted level (2026-10-08).
          pre-emulator-launch-script: |
            test "$(grep '^target=' "$ANDROID_AVD_HOME/test.ini")" = "target=android-37.0" || { cat "$ANDROID_AVD_HOME/test.ini"; echo "::error::AVD descriptor target wrong (expected target=android-37.0, see test.ini above)"; exit 1; }
            grep -q '^target=android-37\.0$' "$ANDROID_AVD_HOME/test.avd/config.ini" || { echo "::error::AVD config.ini lacks target=android-37.0"; exit 1; }
          # android-emulator-runner runs each script line as its own `sh -c`, so a command
          # must fit on one line (a `\` continuation becomes a literal argument).
          # sys.boot_completed can precede the settings and package services; the wait line
          # holds the run until both answer (5 min cap).
          script: |
            adb logcat -v threadtime > "$RUNNER_TEMP/logcat-api37-debug.txt" 2>&1 &
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384" || { echo "PAGE_SIZE != 16384"; exit 1; }
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            timeout 120 adb shell 'until cmd overlay enable com.android.internal.systemui.navbar.threebutton; do sleep 2; done'
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            timeout 120 adb shell 'until settings put global window_animation_scale 0.0 && settings put global transition_animation_scale 0.0 && settings put global animator_duration_scale 0.0; do sleep 2; done'
            adb shell 'getprop init.svc.surfaceflinger' | grep -q running || { echo "::error::surfaceflinger not running after boot"; exit 1; }
            test -r "$RUNNER_TEMP/logcat-api37-debug.txt" && test -s "$RUNNER_TEMP/logcat-api37-debug.txt" || { echo "::error::logcat capture missing, empty or unreadable"; exit 1; }
            ! grep -q 'hasReadColorBufferDma' "$RUNNER_TEMP/logcat-api37-debug.txt" || { echo "::error::goldfish mapper aborted on color-buffer DMA"; exit 1; }
            ./gradlew --max-workers=2 -Pneutrodyne.testScope=nightly -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true connectedDebugAndroidTest
            ./gradlew --max-workers=2 -Pneutrodyne.testScope=nightly connectedAndroidDeviceTest
            python3 scripts/ci/assert-playback-tests.py api37 app/build/outputs/androidTest-results/connected/debug --device connected --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 scripts/ci/assert-discovery-tests.py app/build/outputs/androidTest-results/connected/debug --device connected
      - name: Release smoke on API 37
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: true # never boot a retained AVD — see the target check below
          # The action's automatic animation disable (its default) runs unguarded
          # `settings put` right after sys.boot_completed; on this slow-booting image the
          # settings service was not up and the third put died on "Broken pipe" before our
          # script could wait for it (nightly 2026-10-10, run 38057314395). The script below
          # applies the same scales after its bounded service wait.
          disable-animations: false
          # The 16 KB-page image boots slowly on the hosted runners: with the action's 2 cores, default
          # RAM and 600 s timeout it never finished booting (nightly 2026-10-07).
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          # Guest-side rendering and three-button navigation: with host rendering this image's
          # gralloc mapper aborts surfaceflinger whenever SystemUI samples the gesture handle's
          # region ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"), and each
          # abort restarts system_server (nightly 2026-10-08: 4-12 aborts in 3 min under
          # swiftshader_indirect, swangle_indirect, emulator 37.3.3 and the 37.1 image; none
          # with -gpu guest after the switch to three-button navigation).
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          # avdmanager's exit status cannot be trusted (12.0 exits 0 on a broken AVD), so check
          # the files it wrote: the descriptor gets target=android-0 and config.ini loses its
          # target= line entirely when the tools cannot parse the dotted level (2026-10-08).
          pre-emulator-launch-script: |
            test "$(grep '^target=' "$ANDROID_AVD_HOME/test.ini")" = "target=android-37.0" || { cat "$ANDROID_AVD_HOME/test.ini"; echo "::error::AVD descriptor target wrong (expected target=android-37.0, see test.ini above)"; exit 1; }
            grep -q '^target=android-37\.0$' "$ANDROID_AVD_HOME/test.avd/config.ini" || { echo "::error::AVD config.ini lacks target=android-37.0"; exit 1; }
          script: |
            adb logcat -v threadtime > "$RUNNER_TEMP/logcat-api37-release.txt" 2>&1 &
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            timeout 120 adb shell 'until cmd overlay enable com.android.internal.systemui.navbar.threebutton; do sleep 2; done'
            timeout 300 adb wait-for-device shell 'until cmd settings list global >/dev/null 2>&1 && pm path android >/dev/null 2>&1; do sleep 2; done'
            timeout 120 adb shell 'until settings put global window_animation_scale 0.0 && settings put global transition_animation_scale 0.0 && settings put global animator_duration_scale 0.0; do sleep 2; done'
            adb shell 'getprop init.svc.surfaceflinger' | grep -q running || { echo "::error::surfaceflinger not running after boot"; exit 1; }
            test -r "$RUNNER_TEMP/logcat-api37-release.txt" && test -s "$RUNNER_TEMP/logcat-api37-release.txt" || { echo "::error::logcat capture missing, empty or unreadable"; exit 1; }
            ! grep -q 'hasReadColorBufferDma' "$RUNNER_TEMP/logcat-api37-release.txt" || { echo "::error::goldfish mapper aborted on color-buffer DMA"; exit 1; }
            # AGP uninstalls both APKs after a connected run; the reboot driver below needs them.
            ./gradlew --max-workers=2 -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.annotation=ch.lkmc.neutrodyne.core.testing.ReleaseSmoke -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedReleaseAndroidTest
            python3 scripts/ci/assert-playback-tests.py release app/build/outputs/androidTest-results/connected/release --device connected --apk app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            python3 scripts/ci/assert-discovery-tests.py app/build/outputs/androidTest-results/connected/release --device connected
            # M5 W9: host-driven reboot evidence on the installed release app; the
            # instrumentation process exits before the host reboots the guest. Dispatch-only
            # (scope reboot) while this image's System UI builds no card after reboot (09).
            if [ "${{ inputs.scope }}" = reboot ]; then python3 scripts/ci/playback-reboot.py --hardening; fi
            sha256sum "$RELEASE_ABI_TARGET_APK" > "$RELEASE_ABI_TARGET_SHA"
            scripts/ci/system-tests.sh smoke connected
      # The device log of both emulator steps, for diagnosing a failed run (system_server state).
      - name: Upload the emulator logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api37-16k-logcat
          path: ${{ runner.temp }}/logcat-api37-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api37-playback-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/reports/playback-reboot/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/reports/androidTests/
            benchmark/build/reports/system-tests/
            ${{ runner.temp }}/logcat-api37-*.txt
            ${{ env.RELEASE_ABI_TARGET_SHA }}
          if-no-files-found: error
      - name: Build the release APKs for the alignment check
        run: ./gradlew assembleRelease -Pneutrodyne.abiSplits=true
      - name: 16 KB alignment on the release x86_64 APK (PLAN M11 AC7)
        run: |
          # Test selection must not change the published target APK.
          sha256sum "$RELEASE_ABI_TARGET_APK"
          sha256sum --check "$RELEASE_ABI_TARGET_SHA"
          scripts/ci/check-apk.sh --alignment-only "$RELEASE_ABI_TARGET_APK"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh api37-16k
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh api37-16k --close

  release-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'youtube-smoke'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      # E0 (and from M9a E7) on the published release build — a GMD api36 run of
      # the release variant's tests (PLAN M0 AC4).
      - name: Record the published target APK
        run: |
          ./gradlew assembleRelease
          sha256sum "$RELEASE_ABI_TARGET_APK" > "$RELEASE_ABI_TARGET_SHA"
      # Preserve GMD boot and renderer details when SystemUI stalls.
      - name: api36 release smoke
        run: ./gradlew --info -PtestBuildType=release -Pandroid.testInstrumentationRunnerArguments.annotation=ch.lkmc.neutrodyne.core.testing.ReleaseSmoke -Pandroid.testInstrumentationRunnerArguments.ytxReplay=true api36ReleaseAndroidTest
      - name: Require unchanged published target APK
        run: |
          sha256sum "$RELEASE_ABI_TARGET_APK"
          sha256sum --check "$RELEASE_ABI_TARGET_SHA"
      - name: Require real release playback smoke
        run: python3 scripts/ci/assert-playback-tests.py release app/build/outputs/androidTest-results --device api36 --apk app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
      - name: Require discovery cases in the release smoke
        run: python3 scripts/ci/assert-discovery-tests.py app/build/outputs/androidTest-results --device api36
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-playback-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ${{ env.RELEASE_ABI_TARGET_SHA }}
          if-no-files-found: error
      - name: The tested release build is not debuggable
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-x86_64-release.apk
          [ -n "$BT" ] || { echo "::error::no aapt2 under $ANDROID_HOME/build-tools"; exit 1; }
          [ -f "$APK" ] || { echo "::error::missing release APK: $APK"; exit 1; }
          # a failed dump aborts the step (bash -e); only its output can clear the flag
          BADGING="$($BT dump badging "$APK")"
          if grep -q application-debuggable <<<"$BADGING"; then
            echo "::error::release APK is debuggable"
            exit 1
          fi
          echo "release APK is not debuggable"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh release-build-smoke
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh release-build-smoke --close

  # M3's genuine first-launch restore gate (05 First-launch restore): an opt-in
  # scope, never part of `full`, because the runner argument seeds the snapshot
  # and the class filter keeps the executed evidence to the seeded test — an
  # unseeded run of the class would skip, which must never read as a pass.
  first-launch-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == 'first-launch-restore'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      - name: First-launch restore on api26 + api36
        timeout-minutes: 60
        run: |
          # A cached or stale XML must never supply a missing device leg.
          rm -rf app/build/outputs/androidTest-results/managedDevice/debug/{api26,api36}
          ./gradlew --max-workers=2 \
            :app:api26DebugAndroidTest \
            :app:api36DebugAndroidTest \
            -Pneutrodyne.testScope=nightly \
            -Pandroid.testInstrumentationRunnerArguments.class=ch.lkmc.neutrodyne.FirstLaunchRestoreDeviceTest \
            -Pandroid.testInstrumentationRunnerArguments.firstLaunchSeed=restore \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Verify first-launch restore executed on both APIs
        run: |
          python3 scripts/ci/check-first-launch-restore-results.py \
            app/build/outputs/androidTest-results/managedDevice/debug
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh first-launch-restore
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh first-launch-restore --close
      # The seeded run's XML is the evidence: it must exist on success as well as
      # failure, and the dedicated artifact name keeps a later unseeded suite run
      # from overwriting it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: first-launch-restore-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: error

  # M3 AC6's positive `bmgr` local-transport check (owner matrix 2026-10-20: API 31/36;
  # legacy API 28/29 negative capability rows belong to the sibling probe owner). The
  # black-box release harness (owner decision 2026-10-21): each leg drives the untouched
  # published release APK through scripts/ci/bmgr-check.sh — the self-instrumenting
  # :tools:bmgrdriver APK seeds via the production import UI in its own process, the host
  # triggers SnapshotNowReceiver, backs up through LocalTransport, uninstalls/reinstalls,
  # gates the pre-launch restore window, then pulls the quiescent state and validates it
  # with check-first-launch-restore-results.py --bmgr-pull, plus the encryption-off and
  # empty-dataset controls. --bmgr is the strict aggregate; report-nightly.sh only runs
  # after that verdict.
  bmgr:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'bmgr'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; the script needs adb.
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      # api31/avdmanager descriptor checks don't apply (integer api-level), but the image
      # still needs the checksum-pinned cmdline-tools the other jobs install.
      - name: Install the pinned SDK tools
        run: scripts/ci/install-android-sdk.sh
      # Every APK the legs install is built before the first emulator boots — compiling
      # beside a starved emulator lost system_server's providers mid-run (see api37-16k).
      # No target test APK: the release build stays instrument-free; the self-contained
      # driver APK owns its own package and instrumentation.
      - name: Build the release and driver APKs before the emulators boot
        timeout-minutes: 30
        run: |
          ./gradlew --max-workers=2 :app:assembleRelease :tools:bmgrdriver:assembleAndroidDeviceTest
          test -n "$(find app/build/outputs/apk/release -name 'app-*-release.apk' -print -quit)" || { echo "::error::release APK missing"; exit 1; }
          test -n "$(find tools/bmgrdriver/build/outputs -name '*.apk' -print -quit)" || { echo "::error::driver APK missing"; exit 1; }
      - name: bmgr on api31
        id: api31
        continue-on-error: true # api36's evidence is required even when this leg fails
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BMGR_DISPOSABLE_API31: "1" # acknowledges the disposable-AVD guard
          BMGR_EXPECT_AVD: bmgr-api31
        with:
          api-level: 31
          avd-name: bmgr-api31
          target: default # the rootable default image — never google_play
          arch: x86_64
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: scripts/ci/bmgr-check.sh 31 "$RUNNER_TEMP/bmgr/api31"
      - name: bmgr on api36
        id: api36
        continue-on-error: true
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BMGR_DISPOSABLE_API36: "1"
          BMGR_EXPECT_AVD: bmgr-api36
        with:
          api-level: 36
          avd-name: bmgr-api36
          target: default
          arch: x86_64
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: scripts/ci/bmgr-check.sh 36 "$RUNNER_TEMP/bmgr/api36"
      # The strict aggregate is what closes the run — an emulator step's own exit status
      # is necessary but never sufficient.
      - name: Strict bmgr evidence aggregate
        if: always()
        timeout-minutes: 5
        run: |
          test "${{ steps.api31.outcome }}" = "success" || { echo "::error::api31 leg failed"; exit 1; }
          test "${{ steps.api36.outcome }}" = "success" || { echo "::error::api36 leg failed"; exit 1; }
          python3 scripts/ci/check-first-launch-restore-results.py --bmgr "$RUNNER_TEMP/bmgr"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh bmgr
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh bmgr --close
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bmgr-results
          path: ${{ runner.temp }}/bmgr
          if-no-files-found: error

  # M4 P6b's external background-start IMPOSSIBILITY gate (owner decision: the case
  # cannot live inside the instrumented app APK — active instrumentation grants
  # PROCESS_CAPABILITY_BFSL). The measured verdict: a genuine external
  # background-FGS-start denial is unreachable on api31/api36 — every real
  # media-control surface either cannot command playback (an untrusted Media3
  # connect gets no COMMAND_PLAY_PAUSE) or is exempted by its own bind (a
  # trusted caller's connect stamps code:PROC_STATE_BFGS with
  # startForegroundCount:0 before any startForeground attempt exists to deny).
  # Each leg drives the untouched published release APK through
  # scripts/ci/bgstart-check.sh: the self-instrumenting :tools:bmgrdriver APK
  # seeds a durable paused session via the production import UI (phase bgseed),
  # the host kills the target process, and the bgstart leg BINDS the playback
  # service from the standalone `:tools:bgactor` APK (a demoted, separate uid),
  # proves a continuous >=15 s demoted-and-settled window, then measures both
  # bind surfaces through `:tools:bgtrigger` — the untrusted Media3 connect
  # (real bind, DENIED records, read-only command set, no elevation) and the
  # trusted connect after enabling its NotificationListenerService (the bind
  # must stamp the PROC_STATE_BFGS/startForegroundCount:0 grant). The leg then
  # records exactly one verdict=impossible record.
  # check-first-launch-restore-results.py --bgstart is the strict aggregate over
  # both legs — a run claiming a denial is fabricated and fails closed;
  # report-nightly.sh only runs after that verdict.
  bgstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'bgstart'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # The runner image no longer ships the emulator package; the script needs adb.
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      - name: Install the pinned SDK tools
        run: scripts/ci/install-android-sdk.sh
      # Every APK the legs install is built before the first emulator boots — compiling
      # beside a starved emulator lost system_server's providers mid-run (see api37-16k).
      # No target test APK: the release build stays instrument-free; the self-contained
      # driver APK owns its own package and instrumentation. The bgactor APK is the
      # inert separate-uid binder the bgstart leg needs; the bgtrigger APK is the
      # Media3 controller measured twice — untrusted, then trusted via its
      # notification listener.
      - name: Build the release and driver APKs before the emulators boot
        timeout-minutes: 30
        run: |
          ./gradlew --max-workers=2 :app:assembleRelease :tools:bmgrdriver:assembleAndroidDeviceTest :tools:bgactor:assembleRelease :tools:bgtrigger:assembleRelease
          test -n "$(find app/build/outputs/apk/release -name 'app-*-release.apk' -print -quit)" || { echo "::error::release APK missing"; exit 1; }
          test -n "$(find tools/bmgrdriver/build/outputs -name '*.apk' -print -quit)" || { echo "::error::driver APK missing"; exit 1; }
          test -n "$(find tools/bgactor/build/outputs -name '*-release.apk' -print -quit)" || { echo "::error::actor APK missing"; exit 1; }
          test -n "$(find tools/bgtrigger/build/outputs -name '*-release.apk' -print -quit)" || { echo "::error::trigger APK missing"; exit 1; }
      - name: bgstart on api31
        id: api31
        continue-on-error: true # api36's evidence is required even when this leg fails
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BGSTART_DISPOSABLE_API31: "1" # acknowledges the disposable-AVD guard
          BGSTART_EXPECT_AVD: bgstart-api31
        with:
          api-level: 31
          avd-name: bgstart-api31
          target: default # the rootable default image — never google_play
          arch: x86_64
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: scripts/ci/bgstart-check.sh 31 "$RUNNER_TEMP/bgstart/api31"
      - name: bgstart on api36
        id: api36
        continue-on-error: true
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BGSTART_DISPOSABLE_API36: "1"
          BGSTART_EXPECT_AVD: bgstart-api36
        with:
          api-level: 36
          avd-name: bgstart-api36
          target: default
          arch: x86_64
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: scripts/ci/bgstart-check.sh 36 "$RUNNER_TEMP/bgstart/api36"
      # The strict aggregate is what closes the run — an emulator step's own exit status
      # is necessary but never sufficient.
      - name: Strict bgstart evidence aggregate
        if: always()
        timeout-minutes: 5
        run: |
          test "${{ steps.api31.outcome }}" = "success" || { echo "::error::api31 leg failed"; exit 1; }
          test "${{ steps.api36.outcome }}" = "success" || { echo "::error::api36 leg failed"; exit 1; }
          python3 scripts/ci/check-first-launch-restore-results.py --bgstart "$RUNNER_TEMP/bgstart"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh bgstart
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh bgstart --close
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bgstart-results
          path: ${{ runner.temp }}/bgstart
          if-no-files-found: error

  # MD0's four-target desktop matrix (11 Platform matrix, D88): the same legs as
  # ci.yml's dispatch-only `desktop-matrix`, on the overnight schedule. Each
  # target's unit tests, its own FFmpeg build and its own licence check run on
  # the host that serves it, because a shared library cannot be cross-built and
  # jpackage cannot cross-package. The measured licence evidence is uploaded per
  # target and feeds MD0 AC2's ledger in 11.
  desktop-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runs-on: windows-2025
            # The MSVC FFmpeg compile is the slowest leg; the shared 90-minute
            # ceiling once cut it off mid-build, so the leg gets its own.
            timeout-minutes: 150
          - target: macos-arm64
            runs-on: macos-15
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout-minutes || 90 }}
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'desktop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Android SDK (the KMP android targets configure AGP in every module)
        shell: bash
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          # One SDK location for AGP: the runner image's inherited
          # ANDROID_SDK_ROOT must not disagree with ANDROID_HOME, and on Windows
          # Gradle needs the C:\ form, not the MSYS one.
          sdk_dir="$HOME/android-sdk"
          command -v cygpath >/dev/null 2>&1 && sdk_dir="$(cygpath -w "$sdk_dir")"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      # binutils serves jlink's strip-debug; xvfb and dbus-x11 wrap the desktop
      # UI tests; libegl1 is skiko-linux-arm64's only unresolvable NEEDED entry.
      - name: Host tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          pkgs="binutils xvfb dbus-x11 dbus-daemon"
          [ "${{ matrix.target }}" = linux-arm64 ] && pkgs="$pkgs libegl1"
          sudo apt-get install -y -qq $pkgs
      # FFmpeg's documented MSVC environment (doc/platform.texi): an MSYS2 shell
      # with GNU make, NASM and gpg. `buildFfmpeg` names MSYS2's bash explicitly
      # (Git Bash ships none of the three), and coreutils provides the `timeout`
      # that bounds every download and gpg call inside build.sh.
      - name: MSYS2 tools for the Windows FFmpeg build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          /c/msys64/usr/bin/bash.exe -lc "pacman -S --noconfirm --needed make nasm gnupg tar xz coreutils"
      # The modules MD0 builds on this target. The repository-wide suite stays on
      # linux-x64 in ci.yml's `unit` job, which is where its reference platform
      # is: the committed Roborazzi goldens live in screenshots/{android,desktop}
      # with no per-OS split, so a second desktop OS compares against another
      # font stack, and the file-permission suites of M3/M5 assert POSIX
      # semantics. Neither is evidence about the desktop engine, so neither is a
      # desktop-matrix gate.
      - name: Build the target's FFmpeg and check its licences
        shell: bash
        run: |
          ./gradlew :playback:native:buildFfmpeg \
            :playback:native:checkNativeLicences :playback:native:assembleFfmpegSource
      # On Linux the MPRIS test connects to the private session bus
      # dbus-run-session provides; the runner owns the daemon because test
      # code may not spawn processes (01 banned-API rule 17).
      - name: Desktop engine tests on this host
        shell: bash
        run: |
          tests="./gradlew :playback:engine:test \
            :playback:native:test --continue"
          [ "${{ runner.os }}" = Linux ] && tests="dbus-run-session -- $tests"
          $tests
      - name: Inspect native binary boundaries
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            [ -x "$vswhere" ] || vswhere="/c/Program Files/Microsoft Visual Studio/Installer/vswhere.exe"
            vcroot="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
            vcroot="$(cygpath -u "$vcroot")"
            version="$(cat "$vcroot/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt" | tr -d '\r\n')"
            export PATH="$vcroot/VC/Tools/MSVC/$version/bin/Hostx64/x64:$PATH"
          fi
          python scripts/ci/check-native-binary.py --target "${{ matrix.target }}"
      - name: Collect the licence evidence
        if: always()
        shell: bash
        run: |
          mkdir -p native-evidence
          for f in ffmpeg-build.txt ffmpeg-sizes.txt ffmpeg-license.txt \
                   ffmpeg-protocols.txt ffmpeg-components.txt ffmpeg-config.h; do
            source="playback/native/build/ffmpeg/${{ matrix.target }}/$f"
            [ ! -f "$source" ] || cp "$source" native-evidence/
          done
          cp playback/native/build/ffmpeg-source/*.tar.xz native-evidence/ 2>/dev/null || true
          # A native crash writes its report into the engine module's directory;
          # it is the only stack a segfault leaves, so it rides along too.
          cp playback/engine/hs_err_pid*.log native-evidence/ 2>/dev/null || true
          printf '%s\n' "${{ github.sha }}" > native-evidence/commit.txt
          ls -l native-evidence
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh desktop-matrix-${{ matrix.target }}
      - name: Report recovery
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh desktop-matrix-${{ matrix.target }} --close
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-native-${{ matrix.target }}
          path: |
            native-evidence/
            playback/native/build/ffmpeg/${{ matrix.target }}/lib/
            playback/native/build/ffmpeg/${{ matrix.target }}/bin/
            playback/native/build/ndmedia/${{ matrix.target }}/*ndmedia*
            desktopApp/config/licenses/MIT-0-miniaudio.json
            desktopApp/config/licenses/LGPL-2.1-or-later.json
            playback/native/build/ffmpeg/${{ matrix.target }}/ffmpeg-layout.json
            playback/native/build/ffmpeg-cache/build-${{ matrix.target }}/*.log
            playback/native/build/ndmedia/${{ matrix.target }}/ndmedia-build.txt
            playback/engine/build/test-results/
            playback/engine/build/reports/tests/
            playback/native/build/test-results/
            desktop/system/build/test-results/
          retention-days: 14

  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # Two builds, different checkout paths / CPU counts / umasks (09). Both
      # signed with the committed key, so the APKs compare byte for byte.
      - name: Build A
        run: scripts/ci/repro-build.sh --path /build/a --cpus 2 --umask 022 assembleRelease -Pneutrodyne.abiSplits=true
      - name: Copy build A outputs aside
        run: mkdir -p /tmp/repro-a && cp app/build/outputs/apk/release/*-release.apk /tmp/repro-a/
      - name: Build B
        run: |
          git clean -fdx app/build >/dev/null
          scripts/ci/repro-build.sh --path /home/builder/src/neutrodyne --cpus 4 --umask 002 assembleRelease -Pneutrodyne.abiSplits=true
      # TODO (M0b): also diff the desktop application JARs and the server JAR;
      # the container then installs Temurin 25 from runtime.lock.
      - name: Compare the APKs
        id: diff
        run: |
          ok=1
          for a in /tmp/repro-a/*-release.apk; do
            b="app/build/outputs/apk/release/$(basename "$a")"
            sa=$(sha256sum "$a" | cut -d' ' -f1)
            sb=$(sha256sum "$b" | cut -d' ' -f1)
            echo "$(basename "$a"): $sa vs $sb"
            [ "$sa" = "$sb" ] || ok=0
          done
          echo "identical=$ok" >> "$GITHUB_OUTPUT"
      - name: diffoscope on a difference
        if: steps.diff.outputs.identical == '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq diffoscope >/dev/null
          for a in /tmp/repro-a/*-release.apk; do
            b="app/build/outputs/apk/release/$(basename "$a")"
            diffoscope --html "diff-$(basename "$a").html" "$a" "$b" || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.identical == '0'
        with:
          name: repro-diffoscope
          path: diff-*.html
      - name: Report a mismatch (label repro — report-only, never blocks)
        if: failure() || steps.diff.outputs.identical == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh repro --label repro
      - name: Report recovery
        if: success() && steps.diff.outputs.identical == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh repro --label repro --close

  mutation-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write # report-nightly.sh
    if: inputs.scope == '' || inputs.scope == 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # 09's deep pass over the capped-heap suites the PR gate samples: 1,000
      # seeded iterations per fixture inside the 128 MB `mutationTest` heap.
      # The parses run single-fork, so this is tens of minutes of wall time.
      - name: Update manifest fixture tests
        run: python3 scripts/ci/tests/update-json.test.py

      - name: Mutation robustness, 1,000 iterations per fixture
        # Leaves the job's last 15 minutes for the failure report and upload.
        timeout-minutes: 75
        run: ./gradlew mutationTest -PmutationIterations=1000 --continue
      - name: Report failure
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh mutation-full
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh mutation-full --close
      # The JUnit XML and HTML report carry the failing fixture name and its
      # stack; the fixture's name hash is the reproducer seed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: mutation-full-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  # Diagnostic collection only: BLOCKED is not positive M3 acceptance.
  bmgr-api29-probe:
    if: inputs.scope == 'bmgr-api29-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Start raw evidence
        run: mkdir -p build/bmgr-api29-probe && git rev-parse HEAD > build/bmgr-api29-probe/source.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned SDK tools
        timeout-minutes: 6
        run: scripts/ci/install-android-sdk.sh
      - name: Build synthetic APKs before boot (no Gradle)
        timeout-minutes: 3
        run: python3 scripts/ci/bmgr-api29-probe.py build
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Measure stock API29 (diagnostic only)
        timeout-minutes: 18
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BMGR_DISPOSABLE_API29: "1"
        with:
          api-level: "29"
          target: default
          arch: x86_64
          avd-name: nd-bmgr-api29-probe
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: python3 scripts/ci/bmgr-api29-probe.py probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bmgr-api29-probe-diagnostic
          path: build/bmgr-api29-probe/
          if-no-files-found: error
  bmgr-legacy-negative:
    if: inputs.scope == 'bmgr-legacy-negative'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ["28", "29"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Start raw evidence
        run: mkdir -p build/bmgr-api29-probe && git rev-parse HEAD > build/bmgr-api29-probe/source.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned SDK tools
        timeout-minutes: 6
        run: scripts/ci/install-android-sdk.sh
      - name: Build synthetic APKs before boot (no Gradle)
        timeout-minutes: 3
        run: python3 scripts/ci/bmgr-api29-probe.py build
      - name: Enable KVM
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Measure stock API${{ matrix.api }} legacy LocalTransport (diagnostic only)
        timeout-minutes: 18
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BMGR_DISPOSABLE_API28: ${{ matrix.api == '28' && '1' || '' }}
          BMGR_DISPOSABLE_API29: ${{ matrix.api == '29' && '1' || '' }}
        with:
          api-level: "${{ matrix.api }}"
          target: default
          arch: x86_64
          avd-name: nd-bmgr-api${{ matrix.api }}-probe
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: python3 scripts/ci/bmgr-api29-probe.py probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bmgr-legacy-negative-api${{ matrix.api }}
          path: build/bmgr-api29-probe/
          if-no-files-found: error

  bmgr-download-exclusion:
    permissions:
      contents: read
      issues: write
    if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'downloads'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Enable KVM
        run: |
          # Apply access to the existing node; udev alone left it inaccessible.
          sudo chmod a+rw /dev/kvm
      - name: Build release and seed APKs before boot
        run: ./gradlew --max-workers=2 -PtestBuildType=release :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Inspect backup transport with completed internal and external media
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install $(find app/build/outputs/apk/release -name '*x86_64*release.apk' -print -quit)
            adb install -t app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            scripts/ci/bmgr-download-exclusion.sh ch.lkmc.neutrodyne
      - name: Report failure
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh bmgr-download-exclusion-api${{ matrix.api }}
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/report-nightly.sh bmgr-download-exclusion-api${{ matrix.api }} --close
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bmgr-download-exclusion-api${{ matrix.api }}
          path: build/bmgr-evidence/
