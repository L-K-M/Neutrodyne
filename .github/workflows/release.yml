# SPDX-License-Identifier: Unlicense
#
# release.yml — tag → published immutable GitHub release (09 release.yml).
# M0a carries verify-tag, android and publish; the desktop x4 matrix, sources,
# server-jar, the GHCR image jobs and image-tags land with their milestones
# (TODO stubs at the bottom of `jobs:`).
#
# Build jobs read no secret and need no approval, so they run while the
# maintainer approves the `release` environment, which only `publish` uses.
# Every job uses setup-gradle with cache-disabled (no cache-poisoning surface
# for published builds). The APKs are signed with the committed public
# keystore — nothing to decode, no secret enters the container.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  LANG: C.UTF-8

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.verify.outputs.version }}
      versionCode: ${{ steps.verify.outputs.versionCode }}
      make_latest: ${{ steps.verify.outputs.make_latest }}
      youtube_engine: ${{ steps.verify.outputs.youtube_engine }}
      mac_kind: ${{ steps.verify.outputs.mac_kind }}
      expected_assets: ${{ steps.verify.outputs.expected_assets }}
    permissions:
      contents: read
      actions: read # gh api check-runs / workflow runs for the CI-success check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # branch containment and the release.sh-commit shape
      - name: Verify the tag
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/verify-tag.sh "${{ github.ref_name }}" --products=android,desktop,sources

  android:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The pinned release container — the same one the nightly repro job uses,
    # so published APKs and the repro check share a toolchain. The image digest
    # is Renovate-managed.
    container:
      image: python:3.14-slim-trixie@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain in the container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            openjdk-21-jdk-headless git unzip curl >/dev/null
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          scripts/ci/install-android-sdk.sh /opt/android-sdk
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
      # Nothing else from the runner enters the build; signing comes from the
      # committed keystore (neutrodynePublic). After Podcast Index's written
      # permission (PO-3 option A) this job also passes
      # -Pneutrodyne.podcastIndexKey/Secret and joins the environment.
      - name: assembleRelease
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_HOME=/opt/android-sdk
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon --no-build-cache assembleRelease -Pneutrodyne.abiSplits=true
      - name: Per-APK checks and asset names
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_HOME=/opt/android-sdk
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          v="${{ needs.verify-tag.outputs.version }}"
          mkdir -p dist
          for abi in arm64-v8a x86_64 armeabi-v7a; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/neutrodyne-$v-$abi.apk"
          done
          scripts/ci/check-apk.sh --published dist/neutrodyne-*.apk
          echo "::notice::signer $(scripts/ci/public-cert-sha256.sh --colons)"
      - name: R8 mapping zip
        run: |
          v="${{ needs.verify-tag.outputs.version }}"
          python3 - "$v" <<'PYEOF'
          import os, sys, zipfile
          v = sys.argv[1]
          src = "app/build/outputs/mapping/release"
          with zipfile.ZipFile(f"dist/neutrodyne-{v}-r8-mapping.zip", "w") as z:
              for n in ("mapping.txt", "seeds.txt", "usage.txt"):
                  p = os.path.join(src, n)
                  if os.path.isfile(p):
                      z.write(p, n)
          PYEOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/
          retention-days: 5

  desktop:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runs-on: windows-2025
          - target: macos-arm64
            runs-on: macos-15
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Android SDK (AGP configures in every module)
        shell: bash
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          # One SDK location for AGP (see nightly.yml): no inherited
          # ANDROID_SDK_ROOT disagreement, Windows gets the C:\ form.
          sdk_dir="$HOME/android-sdk"
          command -v cygpath >/dev/null 2>&1 && sdk_dir="$(cygpath -w "$sdk_dir")"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          pkgs="binutils fakeroot rpm xvfb dbus-x11"
          # Same arm64 gap as nightly.yml: skiko needs libEGL.so.1 (libegl1).
          [ "${{ matrix.target }}" = linux-arm64 ] && pkgs="$pkgs libegl1"
          sudo apt-get install -y -qq $pkgs
      # The build, the packaged smoke starts and the checks run in a two-attempt
      # loop — an immutable release cannot gain assets later, so a runner flake
      # gets one retry while a deterministic failure fails twice (09 release.yml
      # step 3, risk P15). The attempt lives in a script because `set -e` does
      # not apply inside a shell function called under `||`.
      - name: Build, smoke and check the target's packages
        shell: bash
        run: |
          args="${{ matrix.target }} ${{ needs.verify-tag.outputs.version }} ${{ needs.verify-tag.outputs.mac_kind }}"
          scripts/ci/build-desktop-release.sh $args \
            || { echo "::warning::attempt 1 failed — retrying once (09 two-attempt loop)"; \
                 scripts/ci/build-desktop-release.sh $args; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: dist/
          retention-days: 5

  sources:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # GPL-2.0 §3: the exact source of the exact runtime, verified and renamed
      # for the release (09 release.yml step 4); WiX's source rides with every
      # MSI (MS-RL). {ffmpeg} and {pbsTag} sources join in MD1b/MD3.
      - name: Download and verify the source tarballs
        run: |
          set -e
          mkdir -p dist
          lock_prop() { grep -E "^$2=" "$1" | tail -1 | cut -d= -f2-; }
          v="$(lock_prop desktopApp/runtime.lock version)"
          url="$(lock_prop desktopApp/runtime.lock sourceTarball.url)"
          sha="$(lock_prop desktopApp/runtime.lock sourceTarball.sha256)"
          curl -fsSL -o "dist/openjdk-$v-temurin-sources.tar.gz" "$url"
          echo "$sha  dist/openjdk-$v-temurin-sources.tar.gz" | sha256sum -c -
          wv="$(lock_prop desktopApp/wix.lock version)"
          wurl="$(lock_prop desktopApp/wix.lock source.url)"
          wsha="$(lock_prop desktopApp/wix.lock source.sha256)"
          curl -fsSL -o "dist/wix-$wv-src.tar.gz" "$wurl"
          echo "$wsha  dist/wix-$wv-src.tar.gz" | sha256sum -c -
      - name: RUNTIME-SOURCES.md
        run: scripts/ci/make-runtime-sources-md.sh --out dist/RUNTIME-SOURCES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sources
          path: dist/
          retention-days: 5

  server-jar:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Android SDK (AGP configures in every module)
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Build the server JAR
        run: |
          v="${{ needs.verify-tag.outputs.version }}"
          mkdir -p dist
          ./gradlew :sync:server:fatJar
          cp "sync/server/build/libs/neutrodyne-server-$v.jar" dist/ || \
            cp sync/server/build/libs/neutrodyne-server-*.jar "dist/neutrodyne-server-$v.jar"
      - name: Smoke the JAR (loopback serve + /healthz)
        run: |
          v="${{ needs.verify-tag.outputs.version }}"
          export NEUTRODYNE_SERVER_DATA="$(mktemp -d)"
          java -jar "dist/neutrodyne-server-$v.jar" serve &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            sleep 1
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
          done
          curl -fsS http://127.0.0.1:8787/healthz | grep -q ok
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-jar
          path: dist/
          retention-days: 5

  # TODO (MS1): `server-image` (matrix, push-by-digest), `server-image-manifest`,
  # and `image-tags` after publish; the server-jar artifact then joins the
  # release's asset set (release-assets.json server group, --products).

  publish:
    needs: [verify-tag, android, desktop, sources, server-jar] # 09: needs every build job
    # server-jar's artifact is not downloaded: the JAR becomes a release asset in
    # MS1 together with the image (release-assets.json server group, --products).
    environment: release # required reviewer; holds no signing secret (09)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # one publisher at a time across ALL tags: two releases may build in parallel,
    # but only one creates/uploads/flips latest, so an older tag can never publish
    # last and take "latest" backwards (make_latest is recomputed in this job).
    concurrency:
      group: release-publish
      cancel-in-progress: false
    outputs:
      # the value computed inside the serialized job — downstream jobs (image-tags, MS1)
      # must consume this, never verify-tag's make_latest, which predates the queue
      make_latest: ${{ steps.publish.outputs.make_latest }}
    permissions:
      contents: write        # gh release create/edit
      id-token: write        # actions/attest
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: android
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: sources
          path: dist
      - name: Compare the asset set with verify-tag's expected list
        env:
          EXPECTED: ${{ needs.verify-tag.outputs.expected_assets }}
          V: ${{ needs.verify-tag.outputs.version }}
        run: |
          cd dist
          expected="$(printf '%s\n' "$EXPECTED" | grep -vE 'neutrodyne-update.json|SHA256SUMS' | sort)"
          actual="$(find . -type f -printf '%P\n' | sort)"
          [ "$expected" = "$actual" ] || { echo "::error::asset set differs"; diff <(echo "$expected") <(echo "$actual"); exit 1; }
      # The runtime exception's release checks (09 step 8): the OpenJDK and WiX
      # source assets against their locks, RUNTIME-SOURCES.md naming vendor and
      # version, and the sources present whenever an MSI ships.
      - name: Runtime exception checks
        run: scripts/ci/check-runtime-sources.sh --release dist
      - name: Update manifest + checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/ci/make-update-json.sh "$TAG" dist
          scripts/ci/check-update-json.sh dist/neutrodyne-update.json dist "$TAG"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Release body
        env:
          TAG: ${{ github.ref_name }}
          V: ${{ needs.verify-tag.outputs.version }}
          MAC_EXT: ${{ needs.verify-tag.outputs.mac_kind == 'dmg' && 'dmg' || 'zip' }}
        run: |
          JDK="$(grep -E '^version=' desktopApp/runtime.lock | cut -d= -f2)"
          WIX="$(grep -E '^version=' desktopApp/wix.lock | cut -d= -f2)"
          cat "changelogs/${{ needs.verify-tag.outputs.versionCode }}.txt" > body.md
          cat >> body.md <<EOF

          Android — pick the APK for your device:
            neutrodyne-$V-arm64-v8a.apk    most phones and tablets
            neutrodyne-$V-x86_64.apk       x86_64 devices and emulators
            neutrodyne-$V-armeabi-v7a.apk  older 32-bit phones (YouTube opens in the YouTube app)
          These APKs are release builds signed with a key that is public in this repository
          (signing/neutrodyne-public.keystore), so the signature does not show who built a file.

          Windows, macOS, Linux — pick the file for your computer:
            Windows 10/11 x64, also Windows 11 on Arm:  neutrodyne-$V-windows-x64.msi (or the portable .zip)
            Mac with Apple silicon, macOS 13 or later:  neutrodyne-$V-macos-arm64.$MAC_EXT
            Linux x64 or arm64:                         neutrodyne-$V-linux-{x64|arm64}.{deb|rpm|tar.gz}
          The desktop builds are not signed by a registered developer. macOS: after installing and after
          every update, open System Settings › Privacy & Security and click "Open Anyway". Windows: choose
          "More info", then "Run anyway"; Smart App Control must be off. They bundle an unmodified OpenJDK
          runtime (GPL-2.0 with the Classpath Exception; source: openjdk-$JDK-temurin-sources.tar.gz,
          RUNTIME-SOURCES.md). The MSI embeds unmodified WiX components (MS-RL; source:
          wix-$WIX-src.tar.gz).
          EOF
          # The FFmpeg, PBS and server blocks of 09's release-body template join
          # with their assets (MD1b, MD3, MS1) — their source names would have
          # unresolved placeholders until then.
          cat >> body.md <<EOF

          Download only from this page and check the file:
            sha256sum --check --ignore-missing SHA256SUMS        (macOS: shasum -a 256 <file>; Windows: Get-FileHash -Algorithm SHA256 <file>)
            gh release verify-asset $TAG <file> -R L-K-M/Neutrodyne
            gh attestation verify <file> -R L-K-M/Neutrodyne

          Guides: https://github.com/L-K-M/Neutrodyne#install-and-update · https://github.com/L-K-M/Neutrodyne#install-on-windows-macos-or-linux
          EOF
      - name: Attest every asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/**
      - name: Draft release, upload assets, publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.verify-tag.outputs.versionCode }}
        run: |
          # make_latest is decided here, not in verify-tag: this job is serialized across
          # tags, so compare against the latest release as it stands now (verify-tag's value
          # was computed before builds and approval and may be stale).
          latest_err="$(mktemp)"
          if latest_tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>"$latest_err")"; then
            lv="${latest_tag#v}"; lm="${lv%%.*}"; lr="${lv#*.}"; ln="${lr%%.*}"; lp="${lr#*.}"
            latest_code=$((lm * 1000000 + ln * 10000 + lp * 100 + 95))
            [ "$VERSION_CODE" -gt "$latest_code" ] && make_latest=true || make_latest=false
          elif grep -qE '404|Not Found' "$latest_err"; then
            make_latest=true # no published release yet: the first release is latest
          else
            cat "$latest_err" >&2
            exit 1
          fi
          rm -f "$latest_err"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --draft --verify-tag --title "Neutrodyne ${TAG#v}" --notes-file body.md
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false --latest="$make_latest"
      - name: Verify the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release verify "$TAG"
          for f in dist/*; do
            # verify-asset hashes the local file — it needs the real path under dist/,
            # not the basename relative to the repository root
            gh release verify-asset "$TAG" "$f"
          done
