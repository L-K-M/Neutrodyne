# SPDX-License-Identifier: Unlicense
#
# release.yml — tag → published GitHub release (09 release.yml).
#
# The job graph of D79: verify-tag decides the version, the asset set and the
# macOS kind; android, desktop (one job per target), sources, server-jar and
# server-sources build the assets; server-image builds and pushes the image by
# digest and server-image-manifest assembles and attests the multi-arch index;
# publish verifies every asset, attests them, creates the draft, uploads and
# publishes the normal release; image-tags moves the GHCR tags only
# after the release is published.
#
# Build jobs read no secret and need no approval, so they run while the
# maintainer approves the `release` environment, which only `publish` uses.
# Every job uses setup-gradle with cache-disabled (no cache-poisoning surface
# for published builds). The APKs are signed with the committed public
# keystore — nothing to decode, no secret enters the container.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  LANG: C.UTF-8

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.verify.outputs.version }}
      versionCode: ${{ steps.verify.outputs.versionCode }}
      make_latest: ${{ steps.verify.outputs.make_latest }}
      youtube_engine: ${{ steps.verify.outputs.youtube_engine }}
      mac_kind: ${{ steps.verify.outputs.mac_kind }}
      expected_assets: ${{ steps.verify.outputs.expected_assets }}
      ffmpeg_version: ${{ steps.verify.outputs.ffmpeg_version }}
    permissions:
      contents: read
      actions: read # gh api check-runs / workflow runs for the CI-success check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # branch containment and the release.sh-commit shape
      - name: Verify the tag
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/verify-tag.sh "${{ github.ref_name }}" --products=android,desktop,sources,ffmpeg-sources,server,server-sources

  android:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The pinned release container — the same one the nightly repro job uses,
    # so published APKs and the repro check share a toolchain. The image digest
    # is Renovate-managed.
    container:
      image: python:3.14-slim-trixie@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain in the container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            openjdk-21-jdk-headless git unzip curl >/dev/null
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          scripts/ci/install-android-sdk.sh /opt/android-sdk
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          # The same location under both names: AGP reads either, and a
          # disagreement between them is a build that configures against the
          # wrong SDK (asserted by install-android-sdk.test.sh).
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
      # Nothing else from the runner enters the build; signing comes from the
      # committed keystore (neutrodynePublic). After Podcast Index's written
      # permission (PO-3 option A) this job also passes
      # -Pneutrodyne.podcastIndexKey/Secret and joins the environment.
      - name: assembleRelease
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_HOME=/opt/android-sdk
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon --no-build-cache assembleRelease -Pneutrodyne.abiSplits=true
      - name: Per-APK checks and asset names
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_HOME=/opt/android-sdk
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/build-tools/36.0.0:$PATH"
          v="${{ needs.verify-tag.outputs.version }}"
          mkdir -p dist
          for abi in arm64-v8a x86_64 armeabi-v7a; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/neutrodyne-$v-$abi.apk"
          done
          scripts/ci/check-apk.sh --published dist/neutrodyne-*.apk
          echo "::notice::signer $(scripts/ci/public-cert-sha256.sh --colons)"
      - name: R8 mapping zip
        run: |
          v="${{ needs.verify-tag.outputs.version }}"
          python3 - "$v" <<'PYEOF'
          import os, sys, zipfile
          v = sys.argv[1]
          src = "app/build/outputs/mapping/release"
          with zipfile.ZipFile(f"dist/neutrodyne-{v}-r8-mapping.zip", "w") as z:
              for n in ("mapping.txt", "seeds.txt", "usage.txt"):
                  p = os.path.join(src, n)
                  if os.path.isfile(p):
                      z.write(p, n)
          PYEOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/
          retention-days: 5

  desktop:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runs-on: windows-2025
          - target: macos-arm64
            runs-on: macos-15
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The KMP android targets configure AGP in every module, so every host
      # needs an SDK even for a desktop-only build.
      - name: Android SDK
        shell: bash
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          sdk_dir="$HOME/android-sdk"
          command -v cygpath >/dev/null 2>&1 && sdk_dir="$(cygpath -w "$sdk_dir")"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # binutils serves jlink's strip-debug and the package checks; fakeroot and
      # rpm build/inspect the RPM; xvfb and dbus wrap the smoke starts; libegl1
      # is skiko-linux-arm64's only unresolvable NEEDED entry.
      - name: Host tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          pkgs="binutils fakeroot rpm xvfb dbus-x11 dbus-daemon"
          [ "${{ matrix.target }}" = linux-arm64 ] && pkgs="$pkgs libegl1"
          # shellcheck disable=SC2086 # the package list is one word per package
          sudo apt-get install -y -qq $pkgs
      # The build, the packaged smoke starts and the checks run in a two-attempt
      # loop — a published release cannot gain assets later, so a runner flake
      # gets one retry while a deterministic failure fails twice (09 release.yml
      # step 3, risk P15).
      - name: Build, smoke and check the target's packages
        shell: bash
        run: |
          args="${{ matrix.target }} ${{ needs.verify-tag.outputs.version }} ${{ needs.verify-tag.outputs.mac_kind }}"
          # shellcheck disable=SC2086 # one argument per word: target, version, mac_kind
          scripts/ci/build-desktop-release.sh $args \
            || { echo "::warning::attempt 1 failed — retrying once (09 two-attempt loop)"; \
                 scripts/ci/build-desktop-release.sh $args; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/
          retention-days: 5

  # MD1b: the LGPL source offer of the FFmpeg build the release ships (11 FFmpeg
  # LGPL obligations). The bundle is reproducible from the native lock alone, so it
  # builds on the Linux x64 runner with the same manylinux toolchain the desktop
  # matrix uses; `checkNativeLicences` re-checks the built libraries' licence
  # envelope before the source is attached.
  sources:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Android SDK (AGP configures in every module)
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # GPL-2.0 §3: the exact source of the exact runtime, verified and renamed
      # for the release; WiX's source rides with every MSI (MS-RL). The PBS
      # source joins from MD3's pbsSource entry, and the FFmpeg source from the
      # native lock through assembleFfmpegSource (which also rebuilds and
      # re-checks the LGPL envelope).
      - name: Download and verify the source tarballs
        run: |
          set -e
          mkdir -p dist
          lock_prop() { grep -E "^$2=" "$1" | tail -1 | cut -d= -f2-; }
          v="$(lock_prop desktopApp/runtime.lock version)"
          url="$(lock_prop desktopApp/runtime.lock sourceTarball.url)"
          sha="$(lock_prop desktopApp/runtime.lock sourceTarball.sha256)"
          curl -fsSL -o "dist/openjdk-$v-temurin-sources.tar.gz" "$url"
          echo "$sha  dist/openjdk-$v-temurin-sources.tar.gz" | sha256sum -c -
          wv="$(lock_prop desktopApp/wix.lock version)"
          wurl="$(lock_prop desktopApp/wix.lock source.url)"
          wsha="$(lock_prop desktopApp/wix.lock source.sha256)"
          curl -fsSL -o "dist/wix-$wv-src.tar.gz" "$wurl"
          echo "$wsha  dist/wix-$wv-src.tar.gz" | sha256sum -c -
          if grep -q '^\[pbsSource\]' youtube/ytdlp-desktop/python-components.lock; then
            pbs_tag="$(awk '/^\[pbsSource\]/{s=1;next} /^\[/{s=0} s&&/^tag *=/{sub(/^[^=]*= *"?/,"");sub(/".*$/,"");print}' youtube/ytdlp-desktop/python-components.lock)"
            pbs_url="$(awk '/^\[pbsSource\]/{s=1;next} /^\[/{s=0} s&&/^url *=/{sub(/^[^=]*= *"?/,"");sub(/".*$/,"");print}' youtube/ytdlp-desktop/python-components.lock)"
            pbs_sha="$(awk '/^\[pbsSource\]/{s=1;next} /^\[/{s=0} s&&/^sha256 *=/{sub(/^[^=]*= *"?/,"");sub(/".*$/,"");print}' youtube/ytdlp-desktop/python-components.lock)"
            curl -fsSL -o "dist/python-build-standalone-$pbs_tag-src.tar.gz" "$pbs_url"
            echo "$pbs_sha  dist/python-build-standalone-$pbs_tag-src.tar.gz" | sha256sum -c -
          fi
      - name: RUNTIME-SOURCES.md
        run: scripts/ci/make-runtime-sources-md.sh --out dist/RUNTIME-SOURCES.md
      - name: Assemble the FFmpeg source bundle
        run: |
          ./gradlew --no-daemon --no-build-cache \
            :playback:native:checkNativeLicences :playback:native:assembleFfmpegSource
          cp playback/native/build/ffmpeg-source/ffmpeg-*-neutrodyne-src.tar.xz dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: dist/
          retention-days: 5

  server-jar:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - run: ./gradlew --no-daemon --no-build-cache :sync:server:fatJar :sync:server:serverNotices
      - name: Packaged JAR smoke
        run: |
          server_data_dir="$(mktemp -d)"
          export NEUTRODYNE_SERVER_DATA="$server_data_dir" NEUTRODYNE_SERVER_UPDATE_CHECK=false
          java -jar sync/server/build/libs/neutrodyne-server-*.jar migrate
          java -jar sync/server/build/libs/neutrodyne-server-*.jar doctor
          java -jar sync/server/build/libs/neutrodyne-server-*.jar serve &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --max-time 5 -fsS http://127.0.0.1:8787/readyz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::server did not answer /readyz within 60s"
            exit 1
          fi
          curl --max-time 5 -fsS http://127.0.0.1:8787/readyz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server
          path: sync/server/build/libs/neutrodyne-server-*.jar
          retention-days: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-notices
          path: sync/server/build/legal/THIRD_PARTY_NOTICES.md
          retention-days: 5

  server-sources:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the exact image sources
        run: |
          scripts/ci/collect-server-sources.sh "${{ needs.verify-tag.outputs.version }}" dist
          # The server runtime's source tarball is a second release asset only
          # when it differs from the desktop runtime's source (10 Image sources
          # and the runtime exception); verify-tag leaves it out otherwise.
          runtime="$(python3 -c 'import json;print(json.load(open("sync/server/deploy/image-sources.lock.json"))["runtime"]["name"])')"
          jdk="$(grep -E '^version=' desktopApp/runtime.lock | tail -1 | cut -d= -f2-)"
          desktop="openjdk-$jdk-temurin-sources.tar.gz"
          if [ "$runtime" = "$desktop" ]; then rm -f "dist/$runtime"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-sources
          path: dist/*
          retention-days: 5

  server-image:
    needs: [verify-tag, server-jar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-server
          path: jar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-notices
          path: legal
      - name: Native digest build and smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.verify-tag.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/neutrodyne-server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/ci/server-image.py prepare --version "$V" --directory context --jar "jar/neutrodyne-server-$V.jar" --notices legal/THIRD_PARTY_NOTICES.md
          docker buildx create --use
          for attempt in 1 2; do
            if docker buildx build --platform linux/${{ matrix.arch }} --build-arg VERSION="$V" --provenance=false \
                --output "type=image,oci-mediatypes=true,name=$image,push-by-digest=true,name-canonical=true,push=true" --metadata-file metadata.json context; then break; fi
            [ "$attempt" -lt 2 ] || exit 1
          done
          digest="$(python3 -c 'import json;print(json.load(open("metadata.json"))["containerimage.digest"])')"
          scripts/ci/check-server-image.sh --no-sources "$image@$digest"
          mkdir digests
          echo "$digest" > digests/${{ matrix.arch }}.digest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests/
          retention-days: 5

  server-image-manifest:
    needs: server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.index.outputs.image }}
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-digest-*
          path: digests
          merge-multiple: true
      - run: scripts/ci/install-oras.sh
      - name: Assemble native manifests into an index
        id: index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/neutrodyne-server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --dry-run "$image@$(cat digests/amd64.digest)" "$image@$(cat digests/arm64.digest)" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "$image@$digest" index.json
          [ "$(oras resolve "$image@$digest")" = "$digest" ]
          {
            echo "digest=$digest"
            echo "image=$image@$digest"
            echo "repository=$image"
          } >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$image@$digest" --raw > index.json
          python3 -c 'import json; d=json.load(open("index.json")); assert d["mediaType"] == "application/vnd.oci.image.index.v1+json"; m=d["manifests"]; assert {x["platform"]["architecture"] for x in m} == {"amd64", "arm64"}'
      - name: Attest the image by digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  publish:
    needs:
      [verify-tag, android, desktop, sources, server-jar, server-sources, server-image-manifest]
    environment: release # required reviewer; holds no signing secret (09)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # one publisher at a time across ALL tags: two releases may build in parallel,
    # but only one creates/uploads/flips latest, so an older tag can never publish
    # last and take "latest" backwards (make_latest is recomputed in this job).
    concurrency:
      group: release-publish
      cancel-in-progress: false
    outputs:
      # the value computed inside the serialized job — downstream jobs (image-tags, MS1)
      # must consume this, never verify-tag's make_latest, which predates the queue
      make_latest: ${{ steps.publish.outputs.make_latest }}
    permissions:
      contents: write        # gh release create/edit
      packages: read         # verify the attested image against its exact sources
      id-token: write        # actions/attest-build-provenance
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sources
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Verify the image and exact sources before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.server-image-manifest.outputs.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$IMAGE" -R "$GITHUB_REPOSITORY"
          scripts/ci/check-server-image.sh "$IMAGE" dist
      - name: Compare the asset set with verify-tag's expected list
        env:
          EXPECTED: ${{ needs.verify-tag.outputs.expected_assets }}
          V: ${{ needs.verify-tag.outputs.version }}
        run: |
          cd dist
          expected="$(printf '%s\n' "$EXPECTED" | grep -vE 'neutrodyne-update.json|SHA256SUMS' | sort)"
          actual="$(find . -type f -printf '%P\n' | sort)"
          [ "$expected" = "$actual" ] || { echo "::error::asset set differs"; diff <(echo "$expected") <(echo "$actual"); exit 1; }
      - name: Runtime exception checks
        run: scripts/ci/check-runtime-sources.sh --release dist
      - name: Update manifest + checksums
        env:
          TAG: ${{ github.ref_name }}
          NEUTRODYNE_SERVER_IMAGE: ${{ needs.server-image-manifest.outputs.image }}
        run: |
          python3 scripts/ci/server-image.py check-sources --version "${TAG#v}" --directory dist
          scripts/ci/make-update-json.sh "$TAG" dist
          scripts/ci/check-update-json.sh dist/neutrodyne-update.json dist "$TAG"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Release body
        env:
          TAG: ${{ github.ref_name }}
          PRODUCTS: android,desktop,sources,ffmpeg-sources,server,server-sources
          IMAGE: ${{ needs.server-image-manifest.outputs.image }}
          FFMPEG: ${{ needs.verify-tag.outputs.ffmpeg_version }}
        run: |
          scripts/ci/make-release-body.py --repo-root . --tag "$TAG" --products "$PRODUCTS" \
            --digest "$IMAGE" --ffmpeg-version "$FFMPEG" --out body.md
      - name: Attest every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
      - name: Draft release, upload assets, publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.verify-tag.outputs.versionCode }}
        run: |
          # make_latest is decided here, not in verify-tag: this job is serialized across
          # tags, so compare against the latest release as it stands now (verify-tag's value
          # was computed before builds and approval and may be stale).
          latest_err="$(mktemp)"
          if latest_tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>"$latest_err")"; then
            lv="${latest_tag#v}"; lm="${lv%%.*}"; lr="${lv#*.}"; ln="${lr%%.*}"; lp="${lr#*.}"
            latest_code=$((lm * 1000000 + ln * 10000 + lp * 100 + 95))
            [ "$VERSION_CODE" -gt "$latest_code" ] && make_latest=true || make_latest=false
          elif grep -qE '404|Not Found' "$latest_err"; then
            make_latest=true # no published release yet: the first release is latest
          else
            cat "$latest_err" >&2
            exit 1
          fi
          rm -f "$latest_err"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --draft --verify-tag --title "Neutrodyne ${TAG#v}" --notes-file body.md
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false --latest="$make_latest"
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          scripts/ci/verify-published-release.py \
            --tag "$TAG" \
            --dist dist \
            --repo "$REPO" \
            --source-digest "$SOURCE_DIGEST" \
            --signer-workflow "$REPO/.github/workflows/release.yml"
      - name: The latest release serves this tag's update manifest
        if: steps.publish.outputs.make_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.verify-tag.outputs.versionCode }}
          REPO_URL: ${{ github.repository }}
        run: |
          url="https://github.com/${REPO_URL}/releases/latest/download/neutrodyne-update.json"
          curl -fsSL "$url" -o latest-update.json
          python3 - "$VERSION_CODE" <<'PYEOF'
          import json, sys
          doc = json.load(open("latest-update.json", encoding="utf-8"))
          code = int(sys.argv[1])
          assert doc["versionCode"] == code, f"latest update manifest names {doc['versionCode']}, not {code}"
          print(f"latest update manifest names versionCode {code}")
          PYEOF

  image-tags:
    needs: [verify-tag, publish, server-image-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both source artifacts land in one directory: the server runtime's
      # source tarball is the desktop one while the two runtimes match (10).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-server-sources
          path: sources
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: sources
      - run: scripts/ci/install-oras.sh
      - name: Verify provenance, source OCI artifact and ordered tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MAKE_LATEST: ${{ needs.publish.outputs.make_latest }}
          IMAGE: ${{ needs.server-image-manifest.outputs.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$IMAGE" -R "$GITHUB_REPOSITORY"
          scripts/ci/promote-server-image.sh "$GITHUB_REF_NAME" "$IMAGE" sources
