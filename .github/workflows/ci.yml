name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run only for a superseded PR push; a cancelled main
# commit masks breakage and breaks CI bisection.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check links, anchors, fences and tables
        run: python3 tools/doccheck/checkdocs.py .

      - name: Parse every Mermaid diagram
        run: |
          npm --prefix tools/doccheck install --no-save mermaid@11 jsdom@25
          node tools/doccheck/mmdcheck.mjs .
