# SPDX-License-Identifier: Unlicense
#
# ci.yml — PR and branch checks (09 ci.yml). Every `uses:` is pinned by full
# commit SHA (tag in the comment; Renovate's helpers:pinGitHubActionDigests
# keeps them current). JDK 21 is the Gradle runtime (listed last so it becomes
# the setup-java default); JDK 25 serves the desktop toolchains. Python 3.14 is
# Chaquopy's build interpreter and both shim suites' host (fallback 3.13, 01 S7).
#
# M0a scope: the Android build and the JVM unit tests (the desktop JVM runs
# every KMP module's commonTest; :sync:server:test covers the server). Tasks
# the design's command lines list but that their owning milestones have not
# created yet are TODO comments below — they join the command as they land
# (checkNativeLicences MD0, shimTestStdio MD3, the desktop/server jobs M0b/MS1;
# checkBrandAssets arrived early with M0a.1 and runs in `static`).

name: ci

on:
  pull_request:
  push:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  LANG: C.UTF-8

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check links, anchors, fences and tables
        run: python3 tools/doccheck/checkdocs.py .
      - name: Parse every Mermaid diagram
        run: |
          npm --prefix tools/doccheck install --no-save mermaid@11 jsdom@25
          node tools/doccheck/mmdcheck.mjs .

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tag comparisons for check-frozen-schemas
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Every implemented 09 `static` gate runs here explicitly — attaching them
      # to `check` alone never ran them in CI (finding: policy gates must be
      # invoked, not just wired). `checkBrandAssets` joined 2026-10-06: it was
      # delivered early with M0a.1, so a hand-edited generated asset must fail
      # here, not only on a local `check`. Still TODO as their milestones land:
      # checkTranslations, :playback:native:checkNativeLicences (MD0),
      # clang-format over playback/native/src/native/ (MD0), detekt SARIF
      # upload with continue-on-error (non-blocking until a stable detekt
      # supports this toolchain).
      - name: KGP assertion (PLAN M0 AC3)
        # The root project's buildEnvironment: plugins load through the included build, so :app's lists none (01 S1)
        run: ./gradlew -q buildEnvironment | grep -E 'kotlin-gradle-plugin:.*2\.4\.20'
      - name: Static checks (M0a)
        run: >-
          ./gradlew spotlessCheck :app:lintRelease assertModuleGraph
          :app:licenseeRelease :desktopApp:licensee :sync:server:licensee
          verifyDependencyPolicy :app:verifyManifestPermissions checkSpdxHeaders
          checkBannedApis checkBrandAssets :youtube:ytdlp:checkPythonLicences
          :youtube:ytdlp-desktop:checkPythonLicences
          :youtube:ytdlp:verifyBundledYtDlp :youtube:ytdlp-desktop:verifyBundledYtDlp
          --continue
      - name: Frozen schemas
        run: scripts/ci/check-frozen-schemas.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.17-sdk36
      # TODO: add `mutationTest`, `:youtube:ytdlp:shimTest` and
      # `:youtube:ytdlp-desktop:shimTestStdio` (MD3) as their milestones land —
      # 09's full line: ./gradlew allTests test mutationTest
      # :youtube:ytdlp:shimTest :youtube:ytdlp-desktop:shimTestStdio
      # -Proborazzi.test.verify=true --continue
      - name: Unit tests (allTests = every KMP module's commonTest+desktopTest; test = JVM and Android host tests incl. :sync:server)
        run: ./gradlew allTests test -Proborazzi.test.verify=true --continue
      - name: Room schema drift
        run: test -z "$(git status --porcelain -- core/database/schemas)" || { echo "::error::Room schema changed without a committed version"; git status --porcelain -- core/database/schemas; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: unit-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/

  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # :sync:server:fatJar keeps the server's packaging task green from M0a.
      # TODO(M0b): add :desktopApp:createDistributable — the desktop image needs
      # the runtime.lock/jlink setup that lands with the desktop package (it
      # fails at createRuntimeImage today).
      - name: Build the APKs and the server JAR
        run: ./gradlew assembleRelease assembleDebug :sync:server:fatJar -Pneutrodyne.abiSplits=true
      # PR builds are signed with the committed public key, so a PR build is
      # signed exactly like a release and needs no secret (09 Hardening).
      - name: Build-output checks on the release APKs
        run: scripts/ci/check-apk.sh --published app/build/outputs/apk/release/*-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apks # test artifacts only — never offered to users (risk P10)
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-jar
          path: sync/server/build/libs/neutrodyne-server-*.jar
          retention-days: 1

  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # 09: only on main pushes, workflow_dispatch or PRs labelled run-instrumented.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'run-instrumented')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Free disk space (09 instrumented preamble)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.android/avd/gradle-managed
          key: gmd-ci-${{ hashFiles('**/build.gradle.kts', 'gradle/libs.versions.toml') }}
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      # GMD `ci` group (API 26 + 36, debug) — the group task resolves in every
      # module that defines it (:app plus the opted-in device-test modules such
      # as :core:database; 09, Unverified KMP task name).
      # The step timeout leaves the job time to upload the device results and logcat
      # when a test hangs; a job-level timeout would cancel the upload too.
      - name: GMD ci group (debug)
        timeout-minutes: 45
        run: ./gradlew --max-workers=2 ciGroupDebugAndroidTest -Pneutrodyne.testScope=ci -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !success() }}
        with:
          name: androidTest-results
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/

  # TODO (M0b): `desktop-smoke` (xvfb-run smoke start of the Linux x64 image +
  # check-desktop-image.sh + check-runtime-sources.sh --image) — `needs: assemble`
  # per 09; it lands with the desktop packaging.

  server:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: server-jar
          # upload-artifact drops the common prefix of the matched files
          path: sync/server/build/libs
      - name: Start the fat JAR and check the endpoints
        run: |
          jar="$(echo sync/server/build/libs/neutrodyne-server-*.jar)"
          export NEUTRODYNE_SERVER_DATA="$(mktemp -d)"
          java -jar "$jar" serve &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            sleep 1
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
          done
          curl -fsS http://127.0.0.1:8787/healthz | grep -q ok
          curl -fsS http://127.0.0.1:8787/readyz
          curl -fsS http://127.0.0.1:8787/.well-known/neutrodyne-sync
          kill $pid 2>/dev/null || true
      - name: A non-loopback listen is refused (PLAN M0 AC16)
        run: |
          jar="$(echo sync/server/build/libs/neutrodyne-server-*.jar)"
          export NEUTRODYNE_SERVER_DATA="$(mktemp -d)" NEUTRODYNE_SERVER_LISTEN=0.0.0.0:8787
          if java -jar "$jar" serve; then
            echo "::error::server accepted a non-loopback listen without the opt-in"
            exit 1
          fi
