# SPDX-License-Identifier: Unlicense
#
# ci.yml — PR and branch checks (09 ci.yml). Every `uses:` is pinned by full
# commit SHA (tag in the comment; Renovate's helpers:pinGitHubActionDigests
# keeps them current). JDK 21 is the Gradle runtime (listed last so it becomes
# the setup-java default); JDK 25 serves the desktop toolchains. Python 3.14 is
# Chaquopy's build interpreter and both shim suites' host (fallback 3.13, 01 S7).
#
# M0a scope: the Android build and the JVM unit tests (the desktop JVM runs
# every KMP module's commonTest; :sync:server:test covers the server). Tasks
# the design's command lines list but that their owning milestones have not
# created yet are TODO comments below — they join the command as they land
# (checkNativeLicences MD0, shimTestStdio MD3, the desktop/server jobs M0b/MS1;
# checkBrandAssets arrived early with M0a.1 and runs in `static`).

name: ci

on:
  pull_request:
  push:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  LANG: C.UTF-8

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check links, anchors, fences and tables
        run: python3 tools/doccheck/checkdocs.py .
      - name: Parse every Mermaid diagram
        run: |
          npm --prefix tools/doccheck install --no-save mermaid@11 jsdom@25
          node tools/doccheck/mmdcheck.mjs .

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tag comparisons for check-frozen-schemas
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Every implemented 09 `static` gate runs here explicitly — attaching them
      # to `check` alone never ran them in CI (finding: policy gates must be
      # invoked, not just wired). `checkBrandAssets` joined 2026-10-06: it was
      # delivered early with M0a.1, so a hand-edited generated asset must fail
      # here, not only on a local `check`. Still TODO as their milestones land:
      # checkTranslations, clang-format over playback/native/src/native/ (MD0,
      # with the first native sources), detekt SARIF upload with
      # continue-on-error (non-blocking until a stable detekt supports this
      # toolchain). `:playback:native:checkNativeLicences` is not a static gate:
      # it reads the four built libraries, so it runs per target in
      # `desktop-matrix` below, where each target's own toolchain exists.
      - name: Native source formatting
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18
          clang-format-18 --dry-run --Werror playback/native/ffmpeg/ffoffsets.c \
            playback/native/ndmedia/*.c playback/native/ndmedia/*.h \
            playback/native/ndmedia/*.cpp playback/native/ndmedia/*.m \
            playback/native/ndmedia/tests/*.c
      - name: KGP assertion (PLAN M0 AC3)
        # The root project's buildEnvironment: plugins load through the included build, so :app's lists none (01 S1)
        run: ./gradlew -q buildEnvironment | grep -E 'kotlin-gradle-plugin:.*2\.4\.20'
      - name: Native policy regression tests
        run: ./gradlew -p build-logic :convention:test --tests NativeLicencePolicyTest
      - name: Static checks (M0a)
        run: >-
          ./gradlew spotlessCheck :app:lintRelease assertModuleGraph
          :app:licenseeRelease :desktopApp:licensee :sync:server:licensee
          verifyDependencyPolicy :app:verifyManifestPermissions checkSpdxHeaders
          checkBannedApis checkBrandAssets :youtube:ytdlp:checkPythonLicences
          :youtube:ytdlp-desktop:checkPythonLicences
          :youtube:ytdlp:verifyBundledYtDlp :youtube:ytdlp-desktop:verifyBundledYtDlp
          :desktopApp:checkEmbeddedNatives
          --continue
      - name: Verify desktop JAR content identity
        run: |
          ./gradlew -p build-logic :convention:test --tests '*DesktopPackagingTest*'
          python3 scripts/ci/tests/canonical-jar-hash.test.py
      - name: Frozen schemas
        run: scripts/ci/check-frozen-schemas.sh
      # The DEB/RPM/MSI licence metadata describes the whole package, which bundles
      # the OpenJDK runtime and third-party libraries, not only our Unlicense code:
      # jpackage's licence file, the RPM License: expression and the DEB control field.
      - name: Desktop package licence metadata
        run: |
          grep -q 'Classpath Exception' desktopApp/packaging/LICENSE-PACKAGE.txt
          grep -q 'This is free and unencumbered software' desktopApp/packaging/LICENSE-PACKAGE.txt
          grep -q '^X-Spdx-License-Identifier: Unlicense AND .*GPL-2.0-only WITH Classpath-exception-2.0' desktopApp/packaging/deb/control
          grep -q '"packaging/LICENSE-PACKAGE.txt"' build-logic/convention/src/main/kotlin/DesktopPackaging.kt
          grep -q '"Unlicense AND Apache-2.0 AND ' build-logic/convention/src/main/kotlin/DesktopPackaging.kt
          grep -q 'GPL-2.0-only WITH Classpath-exception-2.0"$' build-logic/convention/src/main/kotlin/DesktopPackaging.kt
          if grep -n 'rootProject.file("LICENSE")\|rpmLicenseType = "Unlicense"\|^ *"Unlicense",$' build-logic/convention/src/main/kotlin/Desktop*.kt; then
            echo "::error::desktop packaging still labels the whole package with the Unlicense alone"
            exit 1
          fi
      # The CI scripts' own boundary regressions (scripts/ci/tests): fixtures
      # and stubs only, no build outputs — bash, coreutils and python3's stdlib.
      # native-ffmpeg-build.test.sh covers playback/native/ffmpeg/build.sh's
      # guards, the licence envelope of the lock and the shell-function order
      # the four-runner build would otherwise discover (MD0, 11 FFmpeg build).
      - name: Compile the opt-in system-test fixture driver
        run: ./gradlew :app:compileBenchmarkReleaseKotlin -Pneutrodyne.systemTests=true
      - name: CI script fixture tests
        run: |
          scripts/ci/tests/native-ffmpeg-build.test.sh
          scripts/ci/tests/install-android-sdk.test.sh
          scripts/ci/tests/desktop-packaging.test.sh
          scripts/ci/tests/build-desktop-release-windows.test.sh
          python3 scripts/ci/tests/desktop-package-variants.test.py
          python3 scripts/ci/tests/check-desktop-image.test.py
          python3 scripts/ci/tests/report-nightly.test.py
          python3 scripts/ci/tests/first-launch-restore-results.test.py
          python3 scripts/ci/tests/bmgr-api29-probe.test.py
          python3 scripts/ci/tests/assert-playback-tests.test.py
          python3 scripts/ci/tests/assert-server-tests.test.py
          python3 scripts/ci/test-server-image.py
          python3 scripts/ci/tests/playback-reboot.test.py
          python3 scripts/ci/tests/assert-discovery-tests.test.py
          python3 scripts/ci/tests/youtube-feed-canary.test.py
          python3 scripts/ci/tests/release-nightly-gate.test.py
          python3 scripts/ci/tests/trace-instrumentation-abi.test.py
          python3 scripts/ci/tests/emulator-acceleration.test.py
          python3 scripts/ci/tests/gmd-device-budget.test.py
          python3 scripts/ci/tests/preserve-emulator-crashes.test.py
          python3 scripts/ci/tests/preserve-desktop-test-crashes.test.py
          python3 scripts/ci/tests/apply-screenshots.test.py
          python3 scripts/ci/tests/android-notices.test.py
          python3 scripts/ci/tests/assert-download-tests.test.py
          python3 scripts/ci/tests/playback-reboot.test.py
          python3 scripts/ci/tests/update-json.test.py
          python3 scripts/ci/tests/native-msys-reexec.test.py
          python3 scripts/ci/tests/release-assets.test.py
          python3 scripts/ci/tests/release-body.test.py
          python3 scripts/ci/tests/release-workflow.test.py
          python3 scripts/ci/tests/check-apk-published.test.py
          python3 scripts/ci/tests/assert-system-tests.test.py
          python3 scripts/ci/tests/release-ffmpeg-source.test.py
          python3 scripts/ci/tests/check-runtime-sources.test.py
          python3 scripts/ci/tests/smoke-start.test.py
          python3 scripts/ci/tests/network-capture.test.py
      - name: Preserve a formatting repair patch
        if: failure()
        run: |
          format_status=0
          ./gradlew spotlessApply || format_status=$?
          mkdir -p build/md0-evidence
          git diff --binary > build/md0-evidence/format.patch
          exit "$format_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: static-md0-evidence
          path: |
            build/md0-evidence/
            build-logic/convention/build/test-results/

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.17-sdk36
      # :desktop:system's MPRIS test needs a private session bus; the runner
      # owns the daemon because test code may not spawn processes (rule 17).
      - name: Session bus for the MPRIS test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus-daemon
      # TODO: add `:youtube:ytdlp:shimTest` and
      # `:youtube:ytdlp-desktop:shimTestStdio` (MD3) as their milestones land —
      # 09's full line: ./gradlew allTests test mutationTest
      # :youtube:ytdlp:shimTest :youtube:ytdlp-desktop:shimTestStdio
      # -Proborazzi.test.verify=true --continue
      - name: Unit tests (allTests = every KMP module's commonTest+desktopTest; test = JVM and Android host tests incl. :sync:server; mutationTest = the capped-heap robustness suites)
        env:
          # A dedicated temp root for Gradle and its test workers:
          # tempAppDirs() puts each test's <root>/state under java.io.tmpdir,
          # so the crash step below scans one owned root instead of the
          # platform's default.
          TMPDIR: ${{ runner.temp }}/neutrodyne-test-tmp
        run: |
          mkdir -p "$TMPDIR"
          # TMPDIR alone does not pin java.io.tmpdir — OpenJDK's Linux builds
          # report /tmp regardless (Temurin JRE 25 container probe) and macOS
          # keeps its per-user dir. The property itself must be set, and
          # JAVA_TOOL_OPTIONS is inherited by every JVM this step forks:
          # the daemon and each test worker. Existing options are kept.
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }-Djava.io.tmpdir=$TMPDIR"
          dbus-run-session -- ./gradlew allTests test mutationTest -Proborazzi.test.verify=true -Pneutrodyne.pseudoLocales=true --continue
      # A desktop test worker that dies mid-suite leaves no test XML — the
      # debug crash-fast path writes crash-<UTC>.txt under <root>/state and
      # then halt(1)s, and /tmp was never inside the unit-reports glob.
      # always() because a dead worker is the case that needs the files.
      - name: Preserve desktop test crash reports
        if: always()
        run: python3 scripts/ci/preserve-desktop-test-crashes.py "${{ runner.temp }}/neutrodyne-test-tmp" desktopApp/build/test-results/crash-evidence
      - name: Preserve the independent Android DSP reference
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md0-android-dsp-reference
          path: playback/impl/build/md0-reference/
          if-no-files-found: error
      - name: Room schema drift
        run: test -z "$(git status --porcelain -- core/database/schemas)" || { echo "::error::Room schema changed without a committed version"; git status --porcelain -- core/database/schemas; exit 1; }
      - name: Require real-server conformance and 1,000 convergence seeds
        if: success()
        run: python3 scripts/ci/assert-server-tests.py sync/server/build/test-results/test --seeds 1000
      # M7 evidence gate: the shared replay, desktop journeys, host replays and
      # both screenshot surfaces must have executed, unskipped, in this job's XML.
      - name: Require discovery cases in the host XML
        run: |
          python3 scripts/ci/assert-discovery-tests.py .
          python3 scripts/ci/assert-discovery-tests.py . --external-youtube
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ms1-server-evidence
          path: |
            sync/server/build/test-results/test/
            core/data/build/test-results/desktopTest/
            sync/server/build/interop/server-export.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
            **/build/test-results/

  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # :sync:server:fatJar :sync:server:serverNotices keeps the server's packaging task green from M0a.
      # TODO(M0b): add :desktopApp:createDistributable — the desktop image needs
      # the runtime.lock/jlink setup that lands with the desktop package (it
      # fails at createRuntimeImage today).
      - name: Check release instrumentation ABI
        run: |
          ./gradlew --no-configuration-cache --max-workers=2 \
            --init-script scripts/ci/release-abi-inputs.init.gradle \
            -PtestBuildType=release :app:dumpReleaseR8Inputs
          python3 scripts/ci/trace-instrumentation-abi.py --check
      - name: Build the APKs and the server JAR
        run: ./gradlew assembleRelease assembleDebug :app:assembleBenchmarkRelease :benchmark:assembleBenchmarkRelease :sync:server:fatJar :sync:server:serverNotices -Pneutrodyne.abiSplits=true
      # PR builds are signed with the committed public key, so a PR build is
      # signed exactly like a release and needs no secret (09 Hardening).
      - name: Build-output checks on the release APKs
        run: scripts/ci/check-apk.sh --published app/build/outputs/apk/release/*-release.apk
      # The debug APKs are uploaded too (debug-apks), so they get check-apk.sh's section 7
      # notices checks; its other sections are for release builds and reject debug code.
      - name: Third-party notices in the debug APKs
        run: |
          for apk in app/build/outputs/apk/debug/*-debug.apk; do
            python3 -I scripts/ci/android_notices.py check "$apk" --config app/policy/android-notices.toml --quiet
            python3 -I scripts/ci/android_notices.py scan "$apk" --config app/policy/android-notices.toml --quiet \
              --maven-repo third_party/room3-maven --maven-repo third_party/chaquopy-maven \
              --fetch-from https://dl.google.com/dl/android/maven2 \
              --fetch-from https://repo.maven.apache.org/maven2
          done
      # The server JAR carries its third-party notices (generateThirdPartyNotices): the
      # rendered list with the slf4j copyright and the Apache text, each dependency's own
      # licence files, and no embedded NOTICE or licence file left out (scan reads the
      # Gradle cache of this build and downloads what the cache lacks).
      - name: Third-party notices in the server JAR
        run: |
          jar="$(echo sync/server/build/libs/neutrodyne-server-*.jar)"
          notices="$RUNNER_TEMP/server-notices.txt"
          unzip -p "$jar" META-INF/Third-Party-Notices.txt > "$notices"
          test -s "$notices"
          grep -q 'Apache License' "$notices"
          grep -q 'QOS.ch' "$notices"
          grep -q 'kotlinx.coroutines library' "$notices"
          unzip -l "$jar" > "$RUNNER_TEMP/server-jar.lst"
          grep -q 'META-INF/licenses/org.slf4j/slf4j-api/LICENSE.txt' "$RUNNER_TEMP/server-jar.lst"
          python3 -I scripts/ci/android_notices.py check sync/server/build/generated/aboutLibraries/aboutlibraries.json --quiet
          python3 -I scripts/ci/android_notices.py scan sync/server/build/generated/aboutLibraries/aboutlibraries.json --quiet \
            --fetch-from https://dl.google.com/dl/android/maven2 \
            --fetch-from https://repo.maven.apache.org/maven2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks # test artifacts only — never offered to users (risk P10)
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-jar
          path: sync/server/build/libs/neutrodyne-server-*.jar
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-notices
          path: sync/server/build/legal/THIRD_PARTY_NOTICES.md
          retention-days: 1

  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # 09: only on main pushes, workflow_dispatch or PRs labelled run-instrumented.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'run-instrumented')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Free disk space (09 instrumented preamble)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd/gradle-managed
          key: gmd-ci-${{ hashFiles('**/build.gradle.kts', 'gradle/libs.versions.toml', 'build-logic/convention/src/main/kotlin/DeviceTestConventions.kt') }}
      # The runner image no longer ships the emulator package; GMD needs it to boot devices
      - name: Install the Android emulator
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools > /dev/null
      - name: Enable and check KVM
        run: |
          # udev triggers return before their permission updates finish.
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      # GMD `ci` group (API 26 + 36, debug) — each group task resolves in every
      # module that defines it: `ciGroupDebugAndroidTest` for :app, the KMP
      # `ciGroupAndroidDeviceTest` for :core:database (09).
      # The step timeout leaves the job time to upload the device results and logcat
      # when a test hangs; a job-level timeout would cancel the upload too.
      - name: GMD ci group (debug)
        timeout-minutes: 45
        run: ./gradlew --max-workers=2 ciGroupDebugAndroidTest ciGroupAndroidDeviceTest -Pneutrodyne.testScope=ci -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Require playback cases on both CI devices
        run: python3 scripts/ci/assert-playback-tests.py ci app/build/outputs/androidTest-results --device api26 --device api36 --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      # M7 evidence gate: the four share/deep-link journeys and the five shared
      # replay cases must pass on each CI device (PLAN M7 AC4, AC7, AC8, AC10).
      - name: Require discovery cases on both CI devices
        run: |
          python3 scripts/ci/assert-discovery-tests.py app/build/outputs/androidTest-results --device api26 --device api36
          python3 scripts/ci/assert-discovery-tests.py app/build/outputs/androidTest-results --external-youtube --device api26 --device api36
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Always upload, not only on failure: instrumented-device proofs on reviewable PRs are
        # verified from the per-device result XML, which only exists if success uploads too.
        if: ${{ always() }}
        with:
          name: androidTest-results
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/

  # TODO (M0b): `desktop-smoke` (xvfb-run smoke start of the Linux x64 image +
  # check-desktop-image.sh + check-runtime-sources.sh --image) — `needs: assemble`
  # per 09; it lands with the desktop packaging.

  # MD0's four-target desktop matrix (11 Platform matrix, D88). jpackage cannot
  # cross-package and neither can a shared library, so each target's unit tests
  # and its own FFmpeg build and licence check run on the host that serves it:
  # a green `unit` on linux-x64 says nothing about macOS arm64. Dispatch-only:
  # a pull_request or main-push run has no runner for the other three targets,
  # and nightly.yml carries the same job on its schedule. Every `run:` step sets
  # `shell: bash`, and the SDK step exports one SDK location (asserted by
  # scripts/ci/tests/install-android-sdk.test.sh).
  desktop-matrix:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runs-on: windows-2025
            # The MSVC FFmpeg compile is the slowest leg; the shared 90-minute
            # ceiling once cut it off mid-build, so the leg gets its own.
            timeout-minutes: 150
          - target: macos-arm64
            runs-on: macos-15
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout-minutes || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The KMP android targets configure AGP in every module, so every host
      # needs an SDK even for a desktop-only build.
      - name: Android SDK
        shell: bash
        run: |
          scripts/ci/install-android-sdk.sh "$HOME/android-sdk"
          # One SDK location for AGP: the runner image's inherited
          # ANDROID_SDK_ROOT must not disagree with ANDROID_HOME, and on Windows
          # Gradle needs the C:\ form, not the MSYS one.
          sdk_dir="$HOME/android-sdk"
          command -v cygpath >/dev/null 2>&1 && sdk_dir="$(cygpath -w "$sdk_dir")"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # binutils serves jlink's strip-debug; xvfb and dbus-x11 wrap the desktop
      # UI tests; libegl1 is skiko-linux-arm64's only unresolvable NEEDED entry.
      - name: Host tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          pkgs="binutils xvfb dbus-x11 dbus-daemon"
          [ "${{ matrix.target }}" = linux-arm64 ] && pkgs="$pkgs libegl1"
          # shellcheck disable=SC2086 # the package list is word-split on purpose
          sudo apt-get install -y -qq $pkgs
      # FFmpeg's documented MSVC environment (doc/platform.texi): an MSYS2 shell
      # with GNU make, NASM and gpg. `buildFfmpeg` names MSYS2's bash explicitly
      # (Git Bash ships none of the three), and coreutils provides the `timeout`
      # that bounds every download and gpg call inside build.sh.
      - name: MSYS2 tools for the Windows FFmpeg build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          /c/msys64/usr/bin/bash.exe -lc "pacman -S --noconfirm --needed make nasm gnupg tar xz coreutils"
      # The modules MD0 builds on this target. The repository-wide suite stays on
      # linux-x64 in `unit`, which is where its reference platform is: the
      # committed Roborazzi goldens live in screenshots/{android,desktop} with no
      # per-OS split, so a second desktop OS compares against another font stack,
      # and the file-permission suites of M3/M5 assert POSIX semantics. Neither
      # is evidence about the desktop engine, so neither is a desktop-matrix gate.
      # buildFfmpeg, checkNativeLicences and assembleFfmpegSource for the target
      # this host serves: the licence gate reads the built libraries, so it can
      # only run where the build ran (11 FFmpeg build, MD0 AC2).
      - name: Build the target's FFmpeg and check its licences
        shell: bash
        run: |
          ./gradlew :playback:native:buildFfmpeg :playback:native:buildNdmedia \
            :playback:native:checkNativeLicences :playback:native:assembleFfmpegSource
      # The modules MD0 builds on this target, and the corpus suite that loads the
      # FFmpeg build the previous step produced (11 Testing, MD0 AC1).
      # On Linux the MPRIS test connects to the private session bus
      # dbus-run-session provides; the runner owns the daemon because test
      # code may not spawn processes (01 banned-API rule 17).
      - name: Sanitize the native null-device boundary
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/ci/check-ndmedia-sanitizers.sh
      - name: Desktop engine tests on this host
        shell: bash
        run: |
          tests="./gradlew :playback:engine:test :playback:engine:ffmpegTest \
            :playback:desktop:desktopPlaybackTest \
            :playback:native:test :desktop:system:test :desktop:system:systemSessionTest --continue"
          [ "${{ runner.os }}" = Linux ] && tests="dbus-run-session -- $tests"
          $tests
      # The measured evidence MD0 records per target: stripped sizes, the licence
      # string, the protocol inventory, the enabled components and the build's
      # own configure line and toolchain. It exists even when the tests failed,
      # which is when the evidence matters most, so it is collected either way.
      - name: Inspect native binary boundaries
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            [ -x "$vswhere" ] || vswhere="/c/Program Files/Microsoft Visual Studio/Installer/vswhere.exe"
            vcroot="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
            vcroot="$(cygpath -u "$vcroot")"
            version="$(cat "$vcroot/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt" | tr -d '\r\n')"
            export PATH="$vcroot/VC/Tools/MSVC/$version/bin/Hostx64/x64:$PATH"
          fi
          python scripts/ci/check-native-binary.py --target "${{ matrix.target }}"
      - name: Collect the licence evidence
        if: always()
        shell: bash
        run: |
          mkdir -p native-evidence
          for f in ffmpeg-build.txt ffmpeg-sizes.txt ffmpeg-license.txt \
                   ffmpeg-protocols.txt ffmpeg-components.txt ffmpeg-config.h; do
            source="playback/native/build/ffmpeg/${{ matrix.target }}/$f"
            [ ! -f "$source" ] || cp "$source" native-evidence/
          done
          cp playback/native/build/ffmpeg-source/*.tar.xz native-evidence/ 2>/dev/null || true
          # A native crash writes its report into the engine module's directory;
          # it is the only stack a segfault leaves, so it rides along too.
          cp playback/engine/hs_err_pid*.log native-evidence/ 2>/dev/null || true
          printf '%s\n' "${{ github.sha }}" > native-evidence/commit.txt
          ls -l native-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-native-${{ matrix.target }}
          path: |
            native-evidence/
            playback/native/build/ffmpeg/${{ matrix.target }}/lib/
            playback/native/build/ffmpeg/${{ matrix.target }}/bin/
            playback/native/build/ndmedia/${{ matrix.target }}/*ndmedia*
            desktopApp/config/licenses/MIT-0-miniaudio.json
            desktopApp/config/licenses/LGPL-2.1-or-later.json
            playback/native/build/ffmpeg/${{ matrix.target }}/ffmpeg-layout.json
            playback/native/build/ffmpeg-cache/build-${{ matrix.target }}/*.log
            playback/native/build/ndmedia/${{ matrix.target }}/ndmedia-build.txt
            playback/engine/build/test-results/
            playback/engine/build/reports/tests/
            playback/native/build/test-results/
            desktop/system/build/test-results/
          retention-days: 14

  server:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-jar
          # upload-artifact drops the common prefix of the matched files
          path: sync/server/build/libs
      - name: Start the fat JAR and check the endpoints
        run: |
          jar="$(echo sync/server/build/libs/neutrodyne-server-*.jar)"
          server_data_dir="$(mktemp -d)"
          export NEUTRODYNE_SERVER_DATA="$server_data_dir"
          java -jar "$jar" serve &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            sleep 1
            if curl --max-time 5 -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then ready=true; break; fi
          done
          if [[ "$ready" != true ]]; then
            echo "::error::server did not answer /healthz within 60s"
            exit 1
          fi
          curl --max-time 5 -fsS http://127.0.0.1:8787/healthz | grep -q ok
          curl --max-time 5 -fsS http://127.0.0.1:8787/readyz
          curl --max-time 5 -fsS http://127.0.0.1:8787/.well-known/neutrodyne-sync
          kill $pid 2>/dev/null || true
      - name: A non-loopback listen is refused (PLAN M0 AC16)
        run: |
          jar="$(echo sync/server/build/libs/neutrodyne-server-*.jar)"
          server_data_dir="$(mktemp -d)"
          export NEUTRODYNE_SERVER_DATA="$server_data_dir" NEUTRODYNE_SERVER_LISTEN=0.0.0.0:8787
          set +e
          output="$(timeout 30 java -jar "$jar" serve 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::server accepted a non-loopback listen without the opt-in"
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo "::error::server was still serving after 30s: the non-loopback listen was not refused"
            exit 1
          fi
          if ! echo "$output" | grep -q "refusing to listen on 0.0.0.0:8787"; then
            echo "::error::server exited $status without the expected refusal message"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-notices
          path: legal
      - name: Build and check the D95 image
        run: |
          version="$(sed -n 's/^neutrodyne.versionName=//p' gradle.properties)"
          python3 scripts/ci/server-image.py prepare --version "$version" --directory context --jar "sync/server/build/libs/neutrodyne-server-$version.jar" --notices legal/THIRD_PARTY_NOTICES.md
          docker build --build-arg VERSION="$version" -t neutrodyne-server:ci context
          scripts/ci/check-server-image.sh --no-sources neutrodyne-server:ci
