# youtube/ytdlp-desktop/python-components.lock — the desktop engine stack: python-build-standalone
# CPython 3.14.8 (release 20261003) and its bundled libraries, the vendored yt-dlp and the shim
# (01 Python and native components, 11 Lockfiles). checkPythonLicences applies the Python
# allow-list; MPL-2.0 is accepted only for kind = "data" (the unmodified certifi cacert.pem) or
# the pinned kind = "pbs-patches" case (PO-48, approved by the owner 2026-11-07), which requires
# a matching [pbsSource] entry naming this lock's `pbs` release tag with the source tarball
# SHA-256. Component versions are the release's own build metadata (pythonbuild/downloads.json),
# confirmed in the shipped binaries on 2026-11-09.
schema = 1
python = "3.14.8"           # CPython version of the pinned PBS release (build-details.json)
pbs = "20261003"            # python-build-standalone release tag

# The PBS repository archive at the pinned tag, attached to every release that ships the engine
# as python-build-standalone-20261003-src.tar.gz (09 release.yml's sources job; PO-48 source).
[pbsSource]
tag = "20261003"
name = "python-build-standalone-20261003-src.tar.gz"
url = "https://codeload.github.com/astral-sh/python-build-standalone/tar.gz/refs/tags/20261003"
sha256 = "64204f49b71b9041dbcaf38becaca77681a7d04b851d5adb5fe0f7eec1e3c3c4"

# Per-target install_only_stripped archives, SHA-256 verified against the release on 2026-11-09.
# fetchPythonStandalone downloads the current target's archive and checks this checksum.
[[target]]
id = "windows-x64"
archive = "cpython-3.14.8+20261003-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
sha256 = "10e5705e44938ee78de35c62b30fdfe2945b53438343d04c0f53548cdd8e91b6"

[[target]]
id = "macos-arm64"
archive = "cpython-3.14.8+20261003-aarch64-apple-darwin-install_only_stripped.tar.gz"
sha256 = "ed14e9042f36c0aa18383f5d9729bcbf17847e842666a793b5a5a5d8505c0ca1"

[[target]]
id = "linux-x64"
archive = "cpython-3.14.8+20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
sha256 = "d9ec7a6935ade8b671a57ebaf111083d7314eab8dae5071d167054dadd2b97d6"

[[target]]
id = "linux-arm64"
archive = "cpython-3.14.8+20261003-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz"
sha256 = "ece2bf3d4b47c80c2403c5f32fa51a9458abaee93c10def8acafb5f45163e77d"

# CPython and the libraries the install_only_stripped archives bundle (after our trim; Tcl/Tk,
# _dbm/Berkeley DB, pip and the test suite are removed by scripts/engine/trim-python.sh).

[[component]]
